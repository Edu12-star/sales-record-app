function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtLong(d){ return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function fmtMed(d){ return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function plainNum(n){ return String(Math.round(n*100)/100); }

function exportData(){
  var p = state.exportPeriod || 'day';
  var list = periodSales(p).list.slice().sort(function(a,b){ return a.ts-b.ts; });
  var title, from = day, to = day;
  if(p==='day'){ title = fmtLong(parseDay(day)); }
  else if(p==='all'){
    title = 'All recorded sales';
    if(list.length){
      from = list.reduce(function(m,s){ return s.date<m ? s.date : m; }, list[0].date);
      to = list.reduce(function(m,s){ return s.date>m ? s.date : m; }, list[0].date);
    }
  } else {
    var n = p==='7' ? 7 : 30, e = parseDay(day), st = new Date(e);
    st.setDate(st.getDate()-(n-1));
    from = ymd(st); title = fmtMed(st)+' to '+fmtMed(e);
  }
  var cats = {}, order = [], daily = {}, grand = 0, itemCount = 0;
  list.forEach(function(s){
    var c = cats[s.catName];
    if(!c){ c = cats[s.catName] = {name:s.catName, items:{}, total:0}; order.push(c); }
    var k = s.name+'|'+s.unit, it = c.items[k], pr = s.price||0, t = lv(s);
    if(!it){ it = c.items[k] = {name:s.name, unit:s.unit, qty:0, total:0, min:Infinity, max:0}; itemCount++; }
    it.qty += s.qty; it.total += t; it.min = Math.min(it.min,pr); it.max = Math.max(it.max,pr);
    c.total += t; grand += t;
    if(!daily[s.date]) daily[s.date] = {date:s.date, n:0, total:0, ids:{}};
    if(!daily[s.date].ids[s.saleId]){ daily[s.date].ids[s.saleId] = 1; daily[s.date].n++; }
    daily[s.date].total += t;
  });
  var idx = {}; state.categories.forEach(function(c,i){ idx[c.name]=i; });
  order.sort(function(a,b){
    var ia = idx[a.name]===undefined ? 999 : idx[a.name], ib = idx[b.name]===undefined ? 999 : idx[b.name];
    return (ia-ib) || a.name.localeCompare(b.name);
  });
  order.forEach(function(c){
    c.items = Object.keys(c.items).map(function(k){ return c.items[k]; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    c.items.forEach(function(it){
      it.priceText = (it.max===0) ? '-' : (it.min===it.max ? fmtMoney(it.max) : 'avg '+fmtMoney(it.total/it.qty));
    });
  });
  var days = Object.keys(daily).sort().map(function(k){ return daily[k]; });
  return {title:title, from:from, to:to, list:list, cats:order, grand:grand, count:countSales(list),
    itemCount:itemCount, days:days, multiDay:(p!=='day')};
}

function makeSlices(list, metric, group){
  var map = {}, arr = [];
  list.forEach(function(s){
    var key = group==='cat' ? s.catName : s.catName+'|'+s.name;
    var name = group==='cat' ? s.catName : s.name;
    var v = metric==='amount' ? lv(s) : s.qty;
    if(!map[key]){ map[key] = {key:key, name:name, value:0}; arr.push(map[key]); }
    map[key].value += v;
  });
  arr = arr.filter(function(x){ return x.value>0; }).sort(function(a,b){ return b.value-a.value; });
  if(arr.length>9){
    var rest = arr.slice(8);
    arr = arr.slice(0,8).concat([{key:'__other',name:'Other ('+rest.length+')',value:rest.reduce(function(a,x){ return a+x.value; },0),other:true}]);
  }
  var total = 0;
  arr.forEach(function(x,i){ x.color = x.other ? PIE_COLORS[8] : PIE_COLORS[i%8]; total += x.value; });
  return {slices:arr, total:total};
}

function pieSvgStr(slices, total){
  var cx=130, cy=130, r=118, a=-Math.PI/2, out='';
  slices.forEach(function(s){
    var frac = s.value/total, a2 = a+frac*2*Math.PI, mid = (a+a2)/2;
    if(frac>=0.9999){
      out += '<circle cx="130" cy="130" r="118" fill="'+s.color+'" stroke="#fff" stroke-width="2"/>';
    } else {
      var x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      out += '<path d="M130 130 L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A118 118 0 '+(frac>0.5?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+s.color+'" stroke="#fff" stroke-width="2"/>';
    }
    if(frac>=0.06){
      out += '<text x="'+(cx+r*0.62*Math.cos(mid)).toFixed(2)+'" y="'+(cy+r*0.62*Math.sin(mid)).toFixed(2)+'" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="17" font-weight="700" font-family="Arial,sans-serif" style="paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:3px">'+Math.round(frac*100)+'%</text>';
    }
    a = a2;
  });
  return '<svg viewBox="0 0 260 260" width="230" height="230" role="img" aria-label="Pie chart">'+out+'</svg>';
}

function buildReportText(){
  var d = exportData(), L = [], line = '='.repeat(60);
  L.push('SALES RECORD', d.title, 'Generated: '+new Date().toLocaleString(), line, '');
  if(!d.count) L.push('No sales were recorded for this period.');
  d.cats.forEach(function(c){
    L.push(c.name.toUpperCase());
    var head = ['Item','Sold','Price each','Total'];
    var rows = c.items.map(function(it){ return [it.name, fmtQty(it.qty)+' '+it.unit, it.priceText, it.total>0 ? fmtMoney(it.total) : '-']; });
    var w = head.map(function(h,i){
      var m = h.length; rows.forEach(function(r){ if(r[i].length>m) m = r[i].length; });
      if(i===3 && fmtMoney(c.total).length>m) m = fmtMoney(c.total).length;
      return m;
    });
    var fmt = function(r){ return r[0].padEnd(w[0])+'  '+r[1].padStart(w[1])+'  '+r[2].padStart(w[2])+'  '+r[3].padStart(w[3]); };
    var rule = '-'.repeat(fmt(head).length);
    L.push(fmt(head), rule);
    rows.forEach(function(r){ L.push(fmt(r)); });
    L.push(rule, 'Subtotal'.padEnd(w[0]+w[1]+w[2]+4)+'  '+fmtMoney(c.total).padStart(w[3]), '');
  });
  if(d.count){
    L.push(line, 'GRAND TOTAL: '+fmtMoney(d.grand), 'Sales recorded: '+d.count+'   Items sold: '+d.itemCount, line, '');
    var metric = d.grand>0 ? 'amount' : 'qty';
    var m = makeSlices(d.list, metric, 'item');
    if(m.slices.length){
      L.push('SHARE OF SALES ('+(metric==='amount'?'by amount':'by quantity')+')');
      var nw = 0; m.slices.forEach(function(s){ if(s.name.length>nw) nw = s.name.length; });
      m.slices.forEach(function(s){
        var f = s.value/m.total, bar = '#'.repeat(Math.max(1,Math.round(f*20)));
        L.push(s.name.padEnd(nw)+'  '+bar.padEnd(20,'.')+'  '+pieOf(f).padStart(4)+'  '+(metric==='amount'?fmtMoney(s.value):fmtQty(s.value)));
      });
      L.push('');
    }
    if(d.multiDay && d.days.length){
      L.push('DAILY TOTALS');
      d.days.forEach(function(x){ L.push(fmtMed(parseDay(x.date)).padEnd(14)+String(x.n).padStart(3)+(x.n===1?' sale    ':' sales   ')+fmtMoney(x.total)); });
      L.push('');
    }
  }
  L.push('Prices are per unit. Where an item sold at different prices, the average is shown.');
  return L.join('\r\n');
}

function buildCsv(){

  d.list.forEach(function(s){

var MIME = {html:'text/html', txt:'text/plain', csv:'text/csv', json:'application/json'};
async function saveFile(name, text){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      var dl = await window.claude.use('downloads');
      if(dl){
        try{ await dl.save({filename:name, data:text}); toast('Saved '+name); return true; }
        catch(err){ if(!(err && err.code==='declined')) toast('Could not save the file. Try again.'); return false; }
      }
    }
  }catch(e){}
  try{
    var ext = name.split('.').pop();
    var blob = new Blob([text], {type:(MIME[ext]||'text/plain')+';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('Downloading '+name); return true;
  }catch(e){ toast('Downloads are not available here. Open the app in Chrome to download.'); return false; }
}

function printHtml(html){
  try{
    var f = document.createElement('iframe');
    f.setAttribute('aria-hidden','true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.append(f);
    var doc = f.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    setTimeout(function(){
      try{ f.contentWindow.focus(); f.contentWindow.print(); }
      catch(e){ toast('Printing is blocked here. Download the report and print it from there.'); }
      setTimeout(function(){ f.remove(); }, 60000);
    }, 400);
  }catch(e){ toast('Printing is blocked here. Download the report and print it from there.'); }
}

var pos = {q:'', cat:'', lines:[], saleDisc:{mode:'amt', str:''}, showCart:false, step:'shop', pays:[], doneId:null, busy:false, limit:60, seq:0};

function setText(id, t){ var e = $(id); if(e) e.textContent = t; }
function lineGross(l){ return lineCentsOf(l.qtyMilli, l.unitPriceCents); }
function enteredDisc(base, d){ var v = d.mode==='pct' ? pctToCents(base, d.str) : toCents(parseFloat(d.str)); return Math.max(0, v); }
function cartCalc(){
  var xs = pos.lines.map(function(l){ var g = lineGross(l), e = enteredDisc(g, l.disc); return {l:l, gross:g, entered:e, disc:Math.min(e,g)}; });
  var after = xs.reduce(function(a,x){ return a + x.gross - x.disc; },0);
  var eSale = enteredDisc(after, pos.saleDisc), sd = Math.min(eSale, after);
  var tot = computeTotals(xs.map(function(x){ return {qtyMilli:x.l.qtyMilli, unitPriceCents:x.l.unitPriceCents, lineDiscountCents:x.disc}; }), sd);
  return {lines:xs, tot:tot, saleDisc:sd, saleClamped:eSale>after, anyClamped:xs.some(function(x){ return x.entered>x.gross; })};
}
function stockProblem(p, wantMilli){
  if(p.trackStock && !state.allowNegative && wantMilli > (p.stockMilli||0)) return 'Only '+fmtQty((p.stockMilli||0)/1000)+' '+p.unit+' of '+p.name+' in stock.';
  return '';
}
function posVisibleProducts(){
  var q = pos.q.trim().toLowerCase();
  return M.products.filter(function(p){
    if(!p.active) return false;
    var c = M.catById[p.categoryId]; if(!c || !c.active) return false;
    if(pos.cat && p.categoryId!==pos.cat) return false;
    return !q || (p.name+' '+(p.barcode||'')).toLowerCase().indexOf(q)>=0;
  }).sort(byName);
}
function posChanged(){ refreshPosList(); refreshPosCart(); }

function posAddProduct(p, qtyMilli, priceCents){
  var price = priceCents!=null ? priceCents : p.priceCents;
  if(!(price>0)){ askPrice(p, qtyMilli); return false; }
  var ex = pos.lines.filter(function(l){ return l.productId===p.id; })[0];
  var want = (ex ? ex.qtyMilli : 0) + qtyMilli, msg = stockProblem(p, want);
  if(msg){ toast(msg); return false; }
  if(ex){ ex.qtyMilli = want; ex.okMilli = want; }
  else pos.lines.push({key:++pos.seq, productId:p.id, name:p.name, unit:p.unit, qtyMilli:qtyMilli, okMilli:qtyMilli, unitPriceCents:price,
    unitCostCents:(p.costCents==null?null:p.costCents), disc:{mode:'amt', str:''}});
  posChanged(); return true;
}
function posTap(p){ if(WEIGHT_UNITS.indexOf(p.unit)>=0) askQty(p); else posAddProduct(p, 1000); }
function posStep(l, dir){
  var next = l.qtyMilli + dir*1000;
  if(next<=0){ posRemove(l); return; }
  if(dir>0){ var p = M.prodById[l.productId], m = p ? stockProblem(p,next) : ''; if(m){ toast(m); return; } }
  l.qtyMilli = next; l.okMilli = next; posChanged();
}
function posRemove(l){ pos.lines = pos.lines.filter(function(x){ return x!==l; }); posChanged(); }
function posClear(){
  if(!pos.lines.length) return;
  openDialog({title:'Clear the cart?', body:[h('p',null,'All '+pos.lines.length+' item'+(pos.lines.length===1?'':'s')+' will be removed. Nothing has been sold yet.')],
    buttons:[{label:'Keep cart',kind:'ghost',onclick:function(close){ close(); }},
      {label:'Clear cart',id:'clear-confirm',onclick:function(close){ close(); pos.lines = []; pos.saleDisc = {mode:'amt', str:''}; posChanged(); }}]});
}
function askQty(p){
  var inp = h('input',{id:'aq-input',type:'number',step:'any',min:'0',inputmode:'decimal',placeholder:'Quantity ('+p.unit+')','aria-label':'Quantity in '+p.unit}), dlg;
  function go(){
    var q = parseFloat(inp.value);
    if(!(q>0)){ toast('Enter a quantity above 0.'); return; }

  }
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } });
  dlg = openDialog({title:p.name, body:[h('p',{class:'muted'}, mc(p.priceCents)+' per '+p.unit), fld('Quantity ('+p.unit+')', inp)],
    buttons:[{label:'Cancel',kind:'ghost',onclick:function(close){ close(); }}, {label:'Add to cart',id:'aq-add',onclick:go}]});
  setTimeout(function(){ inp.focus(); },0);
}
function askPrice(p, qtyMilli){
  var inp = h('input',{id:'ap-input',type:'number',step:'any',min:'0',inputmode:'decimal',placeholder:'Price per '+p.unit,'aria-label':'Price per '+p.unit}), dlg;
  function go(){
    var v = parseFloat(inp.value);
    if(!(v>0)){ toast('Enter a price above 0.'); return; }
    dlg.close(); posAddProduct(p, qtyMilli, toCents(v));
  }
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } });
  dlg = openDialog({title:p.name, body:[h('p',{class:'muted'},'This product has no selling price yet. The price you type is used for this sale only. Set it on the Products tab to avoid typing it again.'), fld('Price per '+p.unit, inp)],
    buttons:[{label:'Cancel',kind:'ghost',onclick:function(close){ close(); }}, {label:'Add to cart',id:'ap-add',onclick:go}]});
  setTimeout(function(){ inp.focus(); },0);
}
function openLineDiscount(l){
  var d = {mode:l.disc.mode, str:l.disc.str}, gross = lineGross(l);
  var note = h('p',{class:'note',id:'ld-note'});
  var inp = h('input',{id:'ld-input',type:'number',step:'any',min:'0',inputmode:'decimal','aria-label':'Discount',value:d.str,oninput:function(e){ d.str = e.target.value; upd(); }});
  var sel = h('select',{id:'ld-mode','aria-label':'Discount type',onchange:function(e){ d.mode = e.target.value; upd(); }}, h('option',{value:'amt'},'Amount off'), h('option',{value:'pct'},'Percent off'));
  sel.value = d.mode;

/* ===== USB / keyboard-wedge handheld barcode scanner =====
   A USB scanner "types" the barcode into whatever has focus, very fast, and normally finishes with Enter.
   We tell that apart from a person typing by TIMING (keys arriving a few ms apart), so ordinary typing is untouched.
   A scan is only accepted on the POS "shop" screen with no dialog or camera open, and never while the cursor is
   in another input (quantity, discount, payment...). It then goes through the same scanLookup + posTap path as the
   camera and as tapping a product, so stock rules, price prompts and totals are identical. No database access here. */
var USB_MAX_GAP_MS = 100;      // longer pause between keys = not one scan; start over
var USB_AVG_GAP_MS = 45;       // a scan averages faster than this per key (people are usually 80+ ms)
var USB_MIN_LEN = 3;           // shortest code accepted when the scanner ends with Enter/Tab
var USB_IDLE_MIN_LEN = 6;      // shortest code accepted when the scanner sends NO Enter (flushed after a short pause)
var USB_IDLE_FLUSH_MS = 120;   // pause that ends a scan for scanners that send no Enter
var USB_DUP_MS = 150;          // the same code seen twice this close together is one scan

}
function usbTargetKind(t){

  if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return 'field';   // another field: never touched
  return 'idle';                                                                       // nothing is being typed into (page, a button...)
}
function usbReset(){ usb.buf = ''; clearTimeout(usb.idle); usb.idle = null; }

    if(usb.buf && now-usb.last>USB_MAX_GAP_MS) usbReset();
    if(!usb.buf) usb.first = now;

    }
    if(k==='Enter' && now<usb.swallowEnter){ e.preventDefault(); e.stopPropagation(); }   // late Enter after an idle-flushed scan

function usbLooseLookup(code){

function usbProcess(code, input){

    var v = input.value;

  }
  var hit = scanLookup(code) || usbLooseLookup(code);

    var qty = function(){ var l = pos.lines.filter(function(x){ return x.productId===hit.id; })[0]; return l ? l.qtyMilli : 0; };

    var after = qty(), asked = !!document.querySelector('.modal-back');

    else if(asked){ usbBeep(true); usbFlash('ok'); }                         // a quantity/price box opened; scanner resumes when it closes
    else { usbBeep(false); usbFlash('bad'); }                                // posAddProduct already toasted the stock problem

function receiptData(saleId){

  var st = M.settings || {};
  var its = (M.itemsBySale[saleId]||[]).slice().sort(function(a,b){ return ((a.lineNo||0)-(b.lineNo||0)) || (a.id<b.id ? -1 : 1); });
  var pays = (M.paysBySale[saleId]||[]).slice().sort(function(a,b){ return (a.seq||0)-(b.seq||0); });
  var d = new Date(s.ts), grossSum = 0;
  var lines = its.map(function(it){
    var g = it.grossCents!=null ? it.grossCents : it.lineCents; grossSum += g;
    return {name:it.nameSnap, unit:it.unitSnap, qty:it.qtyMilli/1000, unitPriceCents:it.unitPriceCents, grossCents:g, lineDiscCents:it.lineDiscountCents||0};
  });
  var paid = 0, credit = 0, change = 0, creditWho = [];
  pays.forEach(function(p){ if(p.method==='credit'){ credit += p.amountCents; if(p.reference) creditWho.push(p.reference); } else paid += p.amountCents; change += p.changeCents||0; });
  var legacy = s.source==='legacy', quick = s.source==='app';
  return {id:s.id, receiptNo:s.receiptNo, status:s.status, voidReason:s.voidReason||'', voidedAt:s.voidedAt||null, voidedBy:s.voidedBy||'',
    shopName:s.shopName || st.shopName || 'My shop', shopLine:s.shopLine!=null && s.shopLine!=='' ? s.shopLine : (st.shopLine||''), footer:s.footer || st.receiptFooter || 'Thank you for shopping with us.',
    date:d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}), time:d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}),
    device:s.deviceCode || '', cashier:s.createdBy==='owner' ? 'Owner' : (s.createdBy||''), legacy:legacy, quick:quick,
    lines:lines, grossCents:grossSum, discountCents:grossSum - s.totalCents, totalCents:s.totalCents,
    payments:pays, paidCents:paid, creditCents:credit, creditWho:creditWho, changeCents:change, hasPayments:pays.length>0};
}

function receiptDoc(r){
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Receipt '+esc(r.receiptNo)+'</title><style>body{margin:0;background:#fff}@page{margin:6mm}'+RCPT_CSS+'</style></head><body>'+receiptBodyHtml(r)+'</body></html>';
}
function receiptText(r){
  var W = 32, L = [], rule = '-'.repeat(W);
  function ctr(t){ return t.length>=W ? t : ' '.repeat(Math.floor((W-t.length)/2))+t; }
  function two(a,b){ var sp = W-a.length-b.length; return sp>0 ? a+' '.repeat(sp)+b : a+' '+b; }
  L.push(ctr(r.shopName.toUpperCase())); if(r.shopLine) L.push(ctr(r.shopLine));
  if(r.status==='void') L.push(ctr('*** VOIDED ***'));
  L.push(rule, two('Receipt',r.receiptNo), two('Date',r.date), two('Time',r.time), two('Served by', r.cashier+(r.device ? ' ('+r.device+')' : '')));
  if(r.legacy) L.push(two('Record','Legacy entry')); else if(r.quick) L.push(two('Record','Quick entry'));
  L.push(rule);
  r.lines.forEach(function(l){
    L.push(l.name);
    L.push(two('  '+fmtQty(l.qty)+' '+l.unit+' x '+money2(l.unitPriceCents), money2(l.grossCents)));
    if(l.lineDiscCents>0) L.push(two('  Discount','-'+money2(l.lineDiscCents)));
  });
  L.push(rule, two('Subtotal',money2(r.grossCents)), two('Discount',(r.discountCents>0?'-':'')+money2(r.discountCents)), two('TOTAL'+(state.currency?' ('+state.currency+')':''),money2(r.totalCents)), rule);
  if(!r.hasPayments) L.push(two('Payment', r.totalCents===0 ? 'None due' : 'Not recorded'));
  r.payments.forEach(function(p){
    if(p.method==='cash') L.push(two('Cash received', money2(p.tenderedCents!=null ? p.tenderedCents : p.amountCents)));
    else {
      L.push(two(payLabelOf(p)+(p.method==='credit' ? ' (unpaid)' : ''), money2(p.amountCents)));
      if(p.reference) L.push('  '+(p.method==='mpesa' ? 'M-Pesa code (typed in): ' : (p.method==='credit' ? 'Owed by: ' : 'Ref: '))+p.reference);
    }
  });
  if(r.hasPayments){
    L.push(two('Amount paid', money2(r.paidCents)));
    if(r.creditCents>0) L.push(two('On credit (unpaid)', money2(r.creditCents)));
    if(r.changeCents>0) L.push(two('Change', money2(r.changeCents)));
  }
  L.push(rule, ctr(r.footer));
  return L.join('\n');
}

async function shareReceipt(id){

  ps.slice().sort(function(a,b){ return (a.seq||0)-(b.seq||0); }).forEach(function(p){ if(seen.indexOf(p.method)<0){ seen.push(p.method); out.push(payLabelOf(p)); } });

function histSummary(list){

}

async function handleRestoreText(text, fromFirstRun){

      else toast('That is an old-format file. It can only be imported when the app starts empty.');
      return;
    }
    var probs = await validateBackup(c.obj);
    if(probs.length){
      openDialog({title:'This backup cannot be used', body:[h('ul',null,probs.slice(0,6).map(function(x){ return h('li',null,x); })), h('p',{class:'muted'},'Nothing was changed.')],
        buttons:[{label:'Close',onclick:function(close){ close(); }}]});
      return;
    }
    confirmRestore(c.obj.data,'backup file',c.obj.createdAt,c.obj.counts, fromFirstRun ? function(){ screen='app'; view='pos'; afterLoad(); render(); } : null);

  if(g.report) return renderMigrateReport(el);
  if(!v.ok){
    el.append(h('section',{class:'panel',id:'mig-errors'}, h('h2',{class:'bad'},'The old data has problems'),
      h('ul',null,v.errors.slice(0,20).map(function(x){ return h('li',null,x); })),
      h('p',null,'Nothing was changed or moved. Records are never skipped or guessed. Keep this data safe and get it checked before moving it.')));
    return el;
  }
  el.append(h('section',{class:'panel',id:'mig-found'}, h('h2',null,'What was found'),
    h('ul',null, h('li',null,sum.categories+' categories, '+sum.items+' items'), h('li',null,sum.sales+' recorded sales'),
      h('li',null,'Total value: '+exactMoney(sum.total)),
      sum.from ? h('li',null,'From '+sum.from+' to '+sum.to) : null)));
  var needFile = g.source==='browser';
  if(needFile){
    el.append(h('section',{class:'step'}, h('h2',null,'Step 1: save a backup file'),
      h('p',{class:'note',style:'margin-top:0'},'This is required before anything is moved. Keep the file somewhere safe.'),
      h('button',{class:'btn',type:'button',id:'mig-backup',onclick:async function(){
        var f = buildLegacyBackupFile(g.raw, g.sha, sum, g.source), ok = await saveFile(f.name, f.text);
        if(ok){ g.saved = true; g.file = f.name; } render(); }}, g.saved ? 'Save the backup file again' : 'Save backup file'),
      g.saved ? h('p',{class:'ok',id:'mig-saved'},'Backup file created: '+g.file) : null));
    el.append(h('section',{class:'step'}, h('h2',null,'Step 2: confirm'),
      h('label',{class:'chk'}, h('input',{type:'checkbox',id:'mig-ack',disabled:!g.saved,checked:g.ack,onchange:function(e){ g.ack = e.target.checked; render(); }}), ' I have saved the backup file')));
  } else el.append(h('section',{class:'step'}, h('h2',null,'Backup'), h('p',{style:'margin:0'}, g.source==='file' ? 'You loaded this data from a file, so that file is your backup.' : 'This data comes from the copy kept inside the app.')));
  var canStart = !g.running && (!needFile || g.ack);
  el.append(h('section',{class:'step'}, h('h2',null,needFile?'Step 3: move the records':'Move the records'),
    h('button',{class:'btn',type:'button',id:'mig-start',disabled:!canStart,onclick:async function(){
      g.running = true; g.error = null; render();
      try{ g.report = await runMigration(g.raw, g.source); await loadAll(); }catch(e){ g.error = e.message || String(e); }
      g.running = false; render(); }}, g.running ? 'Working...' : 'Start migration'),
    g.error ? h('p',{class:'bad',id:'mig-error'}, g.error+' Nothing was changed.') : null));
  return el;
}
function renderMigrateReport(el){
  var rep = gate.report;
  el.append(h('section',{class:'panel',id:'mig-report-box'}, h('h2',{class:rep.ok?'ok':'bad'}, rep.ok ? 'Migration complete: all checks passed' : 'The checks did not pass, so the move was undone. Your original data is untouched.'), reportBody(rep)));
  if(rep.ok) el.append(h('button',{class:'btn',type:'button',id:'mig-open',onclick:async function(){ await loadAll(); screen='app'; view='pos'; afterLoad(); render(); }},'Open the app'));
  else el.append(h('button',{class:'btn ghost',type:'button',onclick:function(){ gate.report=null; render(); }},'Back'));
  return el;
}

/* ===== main render + start ===== */
function buildMain(){
  var record = h('section',{class:'record'},
    h('div',{class:'addcat'},
      h('input',{id:'newcat',placeholder:'New category, e.g. Cereals','aria-label':'New category name',value:drafts.newcat||'',
        oninput:function(e){ drafts.newcat=e.target.value; },
        onkeydown:function(e){ if(e.key==='Enter'){ e.preventDefault(); addCategory(); } }}),
      h('button',{class:'btn',type:'button',onclick:addCategory},'Add category')
    ),
    state.categories.length ? state.categories.map(catCard) : emptyState()
  );
  return h('main',{class:'layout'}, record, summaryPanel(), piePanel(), exportPanel(), logPanel());
}
function render(){
  var y = window.scrollY, root = $('app');
  if(screen==='loading') root.replaceChildren(h('div',{class:'gate'},h('p',null,'Loading your records...')));
  else if(screen==='fatal') root.replaceChildren(h('div',{class:'gate'},h('h1',{class:'bad'},'The app cannot open its storage'),h('p',{id:'fatal-msg'},gate.msg||''),
    h('p',null,'Nothing was changed. Your data has not been touched.')));
  else if(screen==='first') root.replaceChildren(renderFirstRun());
  else if(screen==='migrate') root.replaceChildren(renderMigrate());
  else {
    var nodes = [backupBanner()];
    if(view==='pos') nodes.push.apply(nodes, posPage());
    else if(view==='receipts') nodes.push(pageHeader('Receipts','Every sale with its items, payments and receipt.'), viewReceipts());
    else if(view==='sales') nodes.push(buildHeader(), buildMain());
    else if(view==='products') nodes.push(pageHeader('Products','Your product list: prices, cost, barcode and stock level.'), viewProducts());
    else if(view==='inventory') nodes.push(pageHeader('Inventory','Stock on hand, low-stock alerts and every stock movement.'), viewInventory());
    else nodes.push(pageHeader('Backup & data','Back up, restore and check your records.'), viewData());
    root.replaceChildren.apply(root, nodes.filter(Boolean));
  }
  window.scrollTo(0,y);
  if(focusId){ var el = $(focusId); if(el) el.focus({preventScroll:true}); focusId = null; }
  flashItem = null;
  usbSyncSoon();
}
function afterLoad(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(M.mismatches.length) toast('Stock check: '+M.mismatches.length+' product(s) do not match the ledger. See Inventory.');
}
async function init(){
  var rs = document.createElement('style'); rs.textContent = RCPT_CSS; document.head.append(rs);
  screen = 'loading'; render();
  try{
    if(!DB) DB = await openDb();
  }catch(e){ screen = 'fatal'; gate = {msg:(e && e.message) || String(e)}; render(); return; }
  try{
    await ensureMeta(); await loadAll();
    var mig = M.migration;
    if(mig && (mig.status==='complete' || mig.status==='not_needed')){ screen = 'app'; view = 'pos'; afterLoad(); }
    else {
      var raw = readLegacyRaw();
      if(raw!==null && raw!==undefined && raw!==''){ await startMigration(raw,'browser'); }
      else if(M.legacyBackup && M.legacyBackup.raw){ await startMigration(M.legacyBackup.raw,'retained'); }
      else screen = 'first';
    }
  }catch(e){ screen = 'fatal'; gate = {msg:(e && e.message) || String(e)}; }
  render();
}

init();
})();
</script>
</body>
</html>
