<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#12302E; --muted:#5A7370; --line:#D0DDD9;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --tint:#DCEEE9; --danger:#B3261E;
  --font-head:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A19; --surface:#142826; --ink:#E3F0ED; --muted:#93AFAA; --line:#26413F;
    --accent:#4FC3AC; --accent-ink:#06211C; --tint:#1B3A36; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A19; --surface:#142826; --ink:#E3F0ED; --muted:#93AFAA; --line:#26413F;
  --accent:#4FC3AC; --accent-ink:#06211C; --tint:#1B3A36; --danger:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.top{max-width:1080px;margin:0 auto;padding:20px 16px 4px;}
.brand{font-weight:600;color:var(--muted);margin-bottom:10px;}
.dayrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;}
.daybig{min-width:0;}
.dayname{font-family:var(--font-head);font-weight:800;font-size:clamp(2rem,7vw,3.1rem);line-height:1;letter-spacing:-.02em;}
.daydate{color:var(--muted);margin-top:4px;}
.tools{margin-left:auto;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted);}
.stats{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap;}
.stat b{display:block;font-family:var(--font-head);font-weight:800;font-size:1.6rem;line-height:1.1;}
.stat span{color:var(--muted);font-size:.9rem;}

input,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;min-width:0;}
input::placeholder{color:var(--muted);opacity:.85;}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;white-space:nowrap;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line);}
.btn:active{transform:translateY(1px);}

.layout{max-width:1080px;margin:0 auto;padding:16px;display:grid;gap:0 20px;grid-template-columns:minmax(0,1fr);grid-template-areas:"sum" "pie" "rec" "dl" "log";align-items:start;}
.record{grid-area:rec;} .sumpanel{grid-area:sum;} .piepanel{grid-area:pie;} .dlpanel{grid-area:dl;} .logpanel{grid-area:log;}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"rec sum" "rec pie" "rec dl" "rec log";grid-template-rows:auto auto auto 1fr;}}
.dlgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.dlgrid .span2{grid-column:1/-1;}
.seg-row{margin-bottom:8px;}
.seg-label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px;}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);padding:6px 4px;min-height:38px;font-size:.88rem;}
.seg button:last-child{border-right:0;}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600;}
.readout{background:var(--tint);border-radius:10px;padding:8px 12px;font-weight:600;margin:12px 0 4px;overflow-wrap:anywhere;}
.pie{display:block;width:100%;max-width:290px;height:auto;margin:8px auto;}
.legend{list-style:none;margin:6px 0 0;padding:0;}
.legend button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;min-height:44px;text-align:left;}
.legend .sw{width:14px;height:14px;border-radius:4px;flex:none;}
.legend .ln{flex:1;min-width:0;overflow-wrap:anywhere;}
.legend .lv{color:var(--muted);font-size:.88rem;white-space:nowrap;}
.legend .lp{font-weight:700;min-width:3em;text-align:right;}
.legend li.dim{opacity:.45;}
.note{color:var(--muted);font-size:.85rem;margin:8px 0 0;}
.qtywrap{display:flex;flex-direction:column;gap:4px;}
.live{min-height:1.3em;color:var(--muted);font-size:.9rem;font-weight:600;}

.addcat{display:flex;gap:8px;margin-bottom:16px;}
.addcat input{flex:1;}

.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cat,var(--accent));border-radius:14px;margin-bottom:14px;overflow:hidden;}
.cardhead{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 4px;}
.cattitle{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 10px;min-height:44px;min-width:0;}
.cattitle h2{margin:0;font-family:var(--font-head);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;overflow-wrap:anywhere;}
.chev{color:var(--muted);transition:transform .15s;display:inline-block;}
.chev.open{transform:rotate(90deg);}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap;}
.cardbody{padding:0 14px 14px;}

.item{display:grid;grid-template-columns:minmax(0,1fr);gap:10px 12px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);border-radius:8px;}
@media (min-width:640px){
  .item{grid-template-columns:minmax(0,1fr) auto;}
  .qty input{flex:none;width:100px;}
}
.item.flash{animation:flash .9s ease-out;}
@keyframes flash{from{background:var(--tint);}to{background:transparent;}}
.iname{min-width:0;}
.iname .n{font-weight:600;overflow-wrap:anywhere;}
.iname .sub{color:var(--muted);font-size:.88rem;}
.badge{display:inline-block;white-space:nowrap;background:var(--tint);border-radius:999px;padding:2px 12px;font-weight:600;font-size:.95rem;margin-top:6px;}
.qty{display:flex;gap:8px;align-items:center;}
.qty input{flex:1;min-width:0;width:auto;}
.qty .unit{color:var(--muted);min-width:2.2em;}
.editgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;grid-column:1/-1;}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 8px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;}
.chip{background:transparent;border:1px dashed var(--muted);border-radius:999px;padding:4px 12px;min-height:34px;color:var(--ink);}
.newitem{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 8px 0;border-top:1px solid var(--line);}
.newitem .btn{grid-column:auto;}
.cardfoot{display:flex;justify-content:space-between;gap:8px;padding-top:12px;}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px 20px;}
.empty h2{margin:0 0 6px;font-family:var(--font-head);font-size:1.3rem;}
.empty p{margin:0 0 14px;color:var(--muted);max-width:52ch;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
.panel h2{margin:0 0 10px;font-family:var(--font-head);font-size:1.15rem;}
.sumcat{font-weight:600;margin-top:12px;}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);}
.sumrow span:last-child{text-align:right;white-space:nowrap;}
.muted{color:var(--muted);}
.total{display:flex;justify-content:space-between;font-weight:800;padding-top:12px;}
.log{list-style:none;margin:0;padding:0;}
.log li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.log .t{color:var(--muted);font-size:.85rem;min-width:3.4em;}
.log .d{flex:1;min-width:0;overflow-wrap:anywhere;}
.log button{background:none;border:0;color:var(--muted);min-height:36px;padding:0 8px;text-decoration:underline;}

#toast{position:fixed;left:50%;bottom:0;transform:translate(-50%,120%);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;margin:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;max-width:calc(100% - 24px);transition:transform .2s;z-index:10;}
#toast.show{transform:translate(-50%,0);}
#toast .tbtn{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0;}
@media (prefers-reduced-motion:reduce){
  .item.flash{animation:none;}
  #toast,.chev{transition:none;}
}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.tabs button{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.pagehead{max-width:1080px;margin:0 auto;padding:20px 16px 0;}
.pagehead h1,.gate h1{font-family:var(--font-head);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:4px 0 6px;letter-spacing:-.02em;}
.page{max-width:1080px;margin:0 auto;padding:16px;}
.gate{max-width:680px;margin:0 auto;padding:24px 16px;}
.gate .panel,.page .panel{margin-bottom:16px;}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border-bottom:1px solid var(--line);padding:10px 16px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar input[type=search]{flex:1;min-width:180px;}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700;margin-left:6px;vertical-align:middle;}
.tag.low{background:#F8E3B0;color:#5E4200;} .tag.out{background:#F7D0CC;color:#80170F;} .tag.ok{background:var(--tint);color:var(--ink);}
.tag.na{background:transparent;border:1px dashed var(--muted);color:var(--muted);}
.chips2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.chip2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:96px;}
.chip2 b{display:block;font-family:var(--font-head);font-size:1.5rem;line-height:1.1;} .chip2 span{color:var(--muted);font-size:.85rem;}
.chip2.low{border-color:#C9A227;} .chip2.out{border-color:var(--danger);}
.invrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
.invrow .invnums{grid-column:1;color:var(--muted);} .invrow .btn{grid-row:1/3;grid-column:2;}
.adjust{border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px;background:var(--bg);}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px;}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted);}
textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;}
input[type=file]{width:100%;margin-bottom:8px;padding:8px;}
.chk{display:flex;gap:8px;align-items:center;min-height:44px;}
.chk input{width:22px;height:22px;min-height:0;}
.ok{color:#1C7A3B;} .bad{color:var(--danger);}
:root[data-theme="dark"] .ok{color:#6FD08C;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ok{color:#6FD08C;}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;}
.step h2{margin:0 0 8px;font-family:var(--font-head);font-size:1.1rem;}
.checks{list-style:none;margin:8px 0;padding:0;} .checks li{padding:5px 0;border-bottom:1px solid var(--line);}
.plist{list-style:none;margin:0;padding:0;}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.pcard.inactive{opacity:.7;} .pbtns{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;}
.rows{list-style:none;margin:0;padding:0;} .rows li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.rows .t{color:var(--muted);font-size:.85rem;min-width:9.5em;} .rows .d{flex:1;min-width:0;overflow-wrap:anywhere;}
.mvq{font-weight:700;white-space:nowrap;} .mvq.neg{color:var(--danger);} .mvq.pos{color:#1C7A3B;}
.subhead{font-size:1rem;margin:16px 0 4px;color:var(--muted);}
.voidlog .d{text-decoration:line-through;color:var(--muted);}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;}
@media (min-width:640px){.modal-back{align-items:center;}}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;}
.modal h2{margin:0 0 10px;font-family:var(--font-head);font-size:1.2rem;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;}

/* ===== Phase 3: POS, payment, receipts ===== */
.posheader{padding-bottom:0;}
.pos{max-width:1180px;margin:0 auto;padding:8px 16px 96px;}
.poscols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);}
.posprods input[type=search]{width:100%;font-size:1.05rem;min-height:52px;}
.poscats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;}
.cchip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:600;}
.cchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.poslist{display:grid;gap:8px;grid-template-columns:minmax(0,1fr);}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:64px;width:100%;}
.prow:active{background:var(--tint);}
.prow.out{opacity:.6;}
.prow .pn{font-weight:700;overflow-wrap:anywhere;}
.prow .ps{grid-column:1;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;}
.prow .pp{grid-row:1/3;grid-column:2;font-family:var(--font-head);font-weight:800;font-size:1.15rem;white-space:nowrap;}
.poscart{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.poscart.open{display:flex;flex-direction:column;position:fixed;inset:0;z-index:15;border-radius:0;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));}
.cartHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
.cartHead h2{margin:0;font-family:var(--font-head);font-size:1.3rem;}
.cartHeadBtns{display:flex;gap:8px;}
.clist{list-style:none;margin:0;padding:0;}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);}
.cline .cln{font-weight:700;overflow-wrap:anywhere;}
.cline .cltot{font-weight:800;white-space:nowrap;text-align:right;}
.clctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.qbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;}
.qin{width:84px;text-align:center;font-weight:700;font-size:1.05rem;}
.saledisc{margin:10px 0;border-top:1px solid var(--line);padding-top:10px;}
.discin{display:flex;gap:8px;margin-top:4px;}
.discin input{flex:1;}
.ptotals{border-top:2px solid var(--ink);padding-top:8px;margin-bottom:12px;}
.prow2{display:flex;justify-content:space-between;gap:10px;padding:3px 0;}
.prow2.grand{font-family:var(--font-head);font-weight:800;font-size:1.6rem;}
.btn.charge{width:100%;min-height:60px;font-size:1.2rem;}
.posbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);}
.posbar .cartbtn{flex:1;min-height:56px;font-size:1.05rem;}
.posbar .chargebtn{min-height:56px;min-width:120px;font-size:1.1rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.posnote{margin:6px 0 4px;}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:600;}
.paypage{max-width:720px;}
.payadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;}
.payadd .btn{min-height:48px;}
.payrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.payrowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.chips3{display:flex;gap:8px;flex-wrap:wrap;}
.chg{font-weight:700;min-height:1.2em;margin-top:4px;}
.paystat .chip2{flex:1;}
.paystat .chip2 b.ok,.paystat .chip2 b.bad{display:block;}
.donepage{max-width:720px;}
.doneinfo h2{margin:0 0 8px;}
.rcptpaper{background:#fff;border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow-x:auto;}
.histrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:8px 0;min-height:56px;}
.histrow .hr1{grid-column:1;}
.histrow .hr2{grid-column:1;font-size:.88rem;}
.histrow .hr3{grid-row:1/3;grid-column:2;font-weight:800;align-self:center;white-space:nowrap;}
.struck{text-decoration:line-through;color:var(--muted);}
.rows.hist li{padding:0;}
@media (min-width:900px){
  .pos{padding-bottom:24px;}
  .poscols{grid-template-columns:minmax(0,1fr) 420px;align-items:start;}
  .poslist{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .poscart,.poscart.open{display:flex;flex-direction:column;position:sticky;inset:auto;top:12px;z-index:auto;border-radius:14px;height:auto;max-height:calc(100vh - 104px);overflow:hidden;padding:12px 14px;}
  .posbar{display:none;}
  .cartclose{display:none;}
}
@media print{.posbar,.tabs,#toast{display:none;}}

.dlgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.dlgrid .btn{white-space:normal;min-width:0;}

.poscart>*{flex:none;}
.poscart>.clist{flex:1 1 auto;min-height:72px;overflow-y:auto;}
.poscart.open>.clist{overflow-y:auto;}
.cline{padding:8px 0;}

.qbtn{width:44px;height:44px;}
.qin{width:68px;}
.clctl{gap:5px;}
.clctl .btn.small{padding:6px 9px;}

.paybar{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:8px;}
.paybar .chips2{margin:0 0 6px;gap:6px;}
.paybar .chip2{padding:6px 10px;min-width:0;}
.paybar .chip2 b{font-size:1.2rem;}

/* ===== Camera barcode scanner ===== */
.searchrow{display:flex;gap:8px;align-items:stretch;}
.searchrow input[type=search]{flex:1;min-width:0;}
.searchrow .scanbtn{flex:none;min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px;}
@media (max-width:480px){.searchrow{flex-direction:column;}.searchrow .scanbtn{width:100%;min-height:48px;}}
/* USB / handheld scanner status chip (POS screen) */
.usbchip{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;margin:8px 0 0;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:500;text-align:left;}
.usbchip::before{content:'';flex:none;width:10px;height:10px;border-radius:50%;background:var(--muted);}
.usbchip.ready{color:var(--ink);background:var(--tint);border-color:var(--accent);}

.usbchip.ok{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint);}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var KEY = 'sales-record-v1';
var COLORS = ['#0F6B5C','#C2571A','#3A5BA0','#8A4F9E','#A67C00','#B3365B'];
var UNITS = ['kg','g','pcs','packs','bags','litres','bottles','boxes','dozen'];
var PRESETS = {
  cereal:{unit:'kg',items:['Rice','Maize flour','Wheat flour','Beans','Millet','Sorghum']},
  dairy:{unit:'pcs',items:['Milk','Yoghurt','Butter','Cheese']},
  beverage:{unit:'pcs',items:['Soda','Water','Juice','Tea leaves']},
  vegetable:{unit:'kg',items:['Tomatoes','Onions','Kale','Cabbage','Potatoes']},
  fruit:{unit:'kg',items:['Bananas','Oranges','Mangoes','Apples']},
  toiletry:{unit:'pcs',items:['Soap','Toothpaste','Toilet paper','Lotion']},
  oil:{unit:'litres',items:['Cooking oil','Margarine']},
  snack:{unit:'pcs',items:['Biscuits','Crisps','Sweets','Chocolate']}
};

var PIE_DEFAULT = {metric:'amount', group:'item', period:'day'};
var PIE_COLORS = ['#2E8B7A','#E07A2F','#4C6FD1','#B5479C','#D9A81E','#D6455D','#5AA33C','#7B61C9','#8B9A9A'];
var pieSel = null;
var APP_VERSION = 'phase3';
var DB_NAME = 'salespos', SCHEMA_VERSION = 2;
var DATA_STORES = ['categories','products','sales','sale_items','stock_movements','payments'];
var ALL_STORES = ['meta','categories','products','sales','sale_items','stock_movements','audit_logs','snapshots','payments'];
var DB = null;
var M = {categories:[], products:[], sales:[], items:[], moves:[], audit:[], snapshots:[], payments:[], saleById:{}, itemsBySale:{}, paysBySale:{}, settings:{}, device:null,
  migration:null, lastExport:null, legacyBackup:null, catById:{}, prodById:{}, mismatches:[]};
var state = {categories:[], sales:[], voided:[], currency:'', pie:Object.assign({},PIE_DEFAULT), exportPeriod:'day', allowNegative:false};
var screen = 'loading', view = 'pos', gate = {};
var day = ymd(new Date());
var drafts = {}, collapsed = {}, editing = {};
var focusId = null, flashItem = null, toastTimer = null;
var pf = {open:false, editId:null, f:{}, q:'', status:'active'};
var inv = {adjustId:null, f:{}, filter:'', checked:null};

/* ===== identifiers, money, quantities ===== */
var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
function uuid(){
  var c = window.crypto;
  if(c && typeof c.randomUUID==='function') return c.randomUUID();
  var b = new Uint8Array(16); c.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  var s = Array.prototype.map.call(b,function(x){ return x.toString(16).padStart(2,'0'); }).join('');
  return s.slice(0,8)+'-'+s.slice(8,12)+'-'+s.slice(12,16)+'-'+s.slice(16,20)+'-'+s.slice(20);
}
// Money is whole cents (KSh x 100). Quantity is whole thousandths (2.5 kg = 2500).
function toCents(x){ var n=Number(x); return isFinite(n) ? Math.round(n*100) : 0; }
function toMilli(x){ var n=Number(x); return isFinite(n) ? Math.round(n*1000) : 0; }
function lineCentsOf(qtyMilli, priceCents){ return Math.round(qtyMilli*priceCents/1000); }
function lv(s){ return s.lineCents/100; }
async function sha256Hex(str){
  try{
    if(window.crypto && window.crypto.subtle){
      var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.prototype.map.call(new Uint8Array(buf),function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
  }catch(e){}
  var h1 = 2166136261; for(var i=0;i<str.length;i++){ h1 ^= str.charCodeAt(i); h1 = Math.imul(h1,16777619); }
  return 'fnv1a-'+(h1>>>0).toString(16);
}
function exactMoney(x){ var t = Number(x).toFixed(3); return t.slice(-1)==='0' ? t.slice(0,-1) : t; }
function bizErr(code, msg, extra){ var e = new Error(msg); e.code = code; e.biz = true; if(extra) e.extra = extra; return e; }
function byCreated(a,b){ return (a.createdAt-b.createdAt) || (a.id<b.id ? -1 : 1); }
function byName(a,b){ return a.name.localeCompare(b.name); }

/* ===== storage layer: IndexedDB ===== */
function req(r){ return new Promise(function(res,rej){ r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
function quiet(p){ p.catch(function(){}); return p; }
function getAllS(tx,n){ return req(tx.objectStore(n).getAll()); }
function getS(tx,n,k){ return req(tx.objectStore(n).get(k)); }
function putS(tx,n,o){ return quiet(req(tx.objectStore(n).put(o))); }
function addS(tx,n,o){ return quiet(req(tx.objectStore(n).add(o))); }
function clearS(tx,n){ return quiet(req(tx.objectStore(n).clear())); }
function byIndex(tx,n,idx,key){ return req(tx.objectStore(n).index(idx).getAll(key)); }

function withTx(names, mode, fn){
  return new Promise(function(resolve, reject){
    var tx, out, failed = false;
    try{ tx = DB.transaction(names, mode); }catch(e){ reject(e); return; }
    tx.oncomplete = function(){ if(!failed) resolve(out); };
    tx.onabort = function(){ if(!failed){ failed = true; reject(tx.error || new Error('The save was cancelled.')); } };
    tx.onerror = function(){};
    Promise.resolve().then(function(){ return fn(tx); }).then(function(v){ out = v; }, function(e){
      failed = true; try{ tx.abort(); }catch(x){} reject(e);
    });
  });
}
function openDb(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error('IndexedDB is not available in this browser')); return; }
    var r; try{ r = window.indexedDB.open(DB_NAME, SCHEMA_VERSION); }catch(e){ rej(e); return; }
    r.onupgradeneeded = function(ev){
      var db = r.result, up = r.transaction, old = ev.oldVersion;
      if(old < 1){
        db.createObjectStore('meta',{keyPath:'key'});
        db.createObjectStore('categories',{keyPath:'id'});
        db.createObjectStore('products',{keyPath:'id'}).createIndex('categoryId','categoryId');
        db.createObjectStore('sales',{keyPath:'id'}).createIndex('date','date');
        var si = db.createObjectStore('sale_items',{keyPath:'id'}); si.createIndex('saleId','saleId'); si.createIndex('productId','productId');
        db.createObjectStore('stock_movements',{keyPath:'id'}).createIndex('productId','productId');
        db.createObjectStore('audit_logs',{keyPath:'id'});
        db.createObjectStore('snapshots',{keyPath:'id'});
      }
      if(old < 2){
        // Phase 3: additive only. Nothing existing is changed or moved.
        db.createObjectStore('payments',{keyPath:'id'}).createIndex('saleId','saleId');
        up.objectStore('sales').createIndex('receiptNo','receiptNo');
      }
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.onblocked = function(){ rej(new Error('The database is in use by another tab. Close other tabs of this app and reload.')); };
  });
}
async function ensureMeta(){
  await withTx(['meta'],'readwrite',async function(tx){
    if(!(await getS(tx,'meta','device'))) await putS(tx,'meta',{key:'device',deviceId:uuid(),prefix:'A',receiptCounter:0,createdAt:Date.now()});
    if(!(await getS(tx,'meta','schema'))) await putS(tx,'meta',{key:'schema',version:SCHEMA_VERSION,createdAt:Date.now(),appVersion:APP_VERSION});
    if(!(await getS(tx,'meta','settings'))) await putS(tx,'meta',{key:'settings',currency:'',pie:Object.assign({},PIE_DEFAULT),exportPeriod:'day',allowNegativeStock:false});
  });
}
function auditPut(tx, action, details){
  return putS(tx,'audit_logs',{id:uuid(), ts:Date.now(), action:action, details:details||{}, user:'owner', deviceId:M.device?M.device.deviceId:null});
}

async function loadAll(){
  var r = await withTx(ALL_STORES,'readonly',function(tx){
    return Promise.all(ALL_STORES.map(function(n){ return getAllS(tx,n); }));
  });
  var by = {}; r[0].forEach(function(m){ by[m.key]=m; });
  M.device = by.device||null; M.migration = by.migration||null; M.settings = by.settings||{};
  M.lastExport = by.lastExport||null; M.legacyBackup = by.legacyBackup||null;
  M.categories = r[1]; M.products = r[2]; M.sales = r[3]; M.items = r[4]; M.moves = r[5]; M.audit = r[6]; M.payments = r[8] || [];
  M.snapshots = r[7].map(function(s){ return {id:s.id, ts:s.ts, reason:s.reason, counts:s.counts}; }).sort(function(a,b){ return b.ts-a.ts; });
  state.currency = M.settings.currency||'';
  state.pie = Object.assign({}, PIE_DEFAULT, M.settings.pie||{});
  state.exportPeriod = M.settings.exportPeriod||'day';
  state.allowNegative = !!M.settings.allowNegativeStock;
  buildViews();
  M.mismatches = ledgerCheck();
}
async function saveSettings(){
  try{
    await withTx(['meta'],'readwrite',async function(tx){
      var cur = (await getS(tx,'meta','settings')) || {key:'settings'};
      cur.currency = state.currency; cur.pie = state.pie; cur.exportPeriod = state.exportPeriod; cur.allowNegativeStock = state.allowNegative;
      await putS(tx,'meta',cur);
    });
  }catch(e){ reportErr(e); }
}

/* ===== views for the screens (same shape the original screens used) ===== */
function viewItem(p){ return {id:p.id, name:p.name, unit:p.unit, price:p.priceCents/100, p:p}; }
function buildViews(){
  M.catById = {}; M.prodById = {};
  M.categories.forEach(function(c){ M.catById[c.id]=c; });
  M.products.forEach(function(p){ M.prodById[p.id]=p; });
  state.categories = M.categories.filter(function(c){ return c.active; }).sort(byCreated).map(function(c){
    return {id:c.id, name:c.name, items:M.products.filter(function(p){ return p.active && p.categoryId===c.id; }).sort(byCreated).map(viewItem)};
  });
  var saleById = {}; M.sales.forEach(function(s){ saleById[s.id]=s; });
  M.saleById = saleById; M.itemsBySale = {}; M.paysBySale = {};
  M.items.forEach(function(it){ (M.itemsBySale[it.saleId] = M.itemsBySale[it.saleId] || []).push(it); });
  M.payments.forEach(function(p){ (M.paysBySale[p.saleId] = M.paysBySale[p.saleId] || []).push(p); });
  var lines = [], voided = [];
  M.items.forEach(function(it){
    var s = saleById[it.saleId]; if(!s) return;
    var l = {id:s.id, saleId:s.id, receiptNo:s.receiptNo, itemId:it.productId, catId:it.categoryId, catName:it.categoryNameSnap, name:it.nameSnap,
      unit:it.unitSnap, price:it.unitPriceCents/100, qty:it.qtyMilli/1000, lineCents:it.lineCents, date:s.date, ts:s.ts, seq:s.seq, source:s.source,
      voidReason:s.voidReason||'', costKnown:it.costKnown};
    (s.status==='void' ? voided : lines).push(l);
  });
  lines.sort(function(a,b){ return a.seq-b.seq; });
  voided.sort(function(a,b){ return b.ts-a.ts; });
  state.sales = lines; state.voided = voided;
}

/* ===== Phase 3: shared money maths (used by the POS screen AND the sale service, so they can never disagree) ===== */
var PAY_LABEL = {cash:'Cash', mpesa:'M-Pesa', card:'Card', credit:'Credit', other:'Other'};
var WEIGHT_UNITS = ['kg','g','litres'];
function mc(cents){ return fmtMoney(cents/100); }
function money2(cents){ return (cents/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
// A percentage is read as basis points (12.5% = 1250) and applied with integer rounding.
function pctToCents(baseCents, pctStr){
  var bp = Math.round(parseFloat(pctStr)*100);
  if(!(bp>0)) return 0;
  return Math.round(baseCents*bp/10000);
}
// Split a whole-cent amount across weights so the parts add up EXACTLY to the amount (largest remainder).
function allocate(total, weights){
  var out = weights.map(function(){ return 0; }), sum = weights.reduce(function(a,b){ return a+b; },0);
  if(!(total>0) || !(sum>0)) return out;
  var rem = [], used = 0;
  weights.forEach(function(w,i){ var exact = total*w/sum, fl = Math.floor(exact); out[i] = fl; used += fl; rem.push({i:i, r:exact-fl}); });
  rem.sort(function(a,b){ return (b.r-a.r) || (a.i-b.i); });
  for(var k=0;k<total-used;k++) out[rem[k%rem.length].i]++;
  return out;
}
// lines: [{qtyMilli, unitPriceCents, lineDiscountCents}]. Every number is a whole cent.
function computeTotals(lines, saleDiscCents){
  var gross = 0, lineDisc = 0, after = 0;
  var rows = lines.map(function(l){
    var g = lineCentsOf(l.qtyMilli, l.unitPriceCents), d = l.lineDiscountCents||0;
    gross += g; lineDisc += d; after += g-d;
    return {gross:g, lineDisc:d, afterLine:g-d};
  });
  var sd = saleDiscCents||0, shares = allocate(sd, rows.map(function(r){ return r.afterLine; }));
  rows.forEach(function(r,i){ r.saleShare = shares[i]; r.net = r.afterLine - shares[i]; });
  return {rows:rows, grossCents:gross, lineDiscCents:lineDisc, afterLineCents:after, saleDiscCents:sd, discountCents:lineDisc+sd, totalCents:after-sd};
}
// rows: [{k, method, amountCents (cash: the amount handed over), reference}] with amountCents > 0.
// Cash is the only method that may be more than what is due (the extra is change). Credit counts as settling the amount, but unpaid.
function calcPayments(totalCents, rows){
  var noncash = 0, creditC = 0, cashT = 0, problems = [];
  rows.forEach(function(r){
    if(r.method==='cash') cashT += r.amountCents;
    else { noncash += r.amountCents; if(r.method==='credit') creditC += r.amountCents; }
  });
  var cashDue = totalCents - noncash, left = Math.max(0, cashDue), applied = 0;
  var recs = rows.map(function(r){
    if(r.method!=='cash') return {row:r, appliedCents:r.amountCents, tenderedCents:null, changeCents:0};
    var a = Math.min(r.amountCents, left); left -= a; applied += a;
    return {row:r, appliedCents:a, tenderedCents:r.amountCents, changeCents:r.amountCents-a};
  });
  if(noncash>totalCents) problems.push('over');
  if(recs.some(function(x){ return x.row.method==='cash' && x.appliedCents===0; })) problems.push('cash_unused');
  var covered = noncash + applied, remaining = totalCents - covered;
  return {recs:recs, problems:problems, noncashCents:noncash, creditCents:creditC, cashTenderedCents:cashT, cashAppliedCents:applied,
    paidCents:noncash-creditC+applied, changeCents:cashT-applied, remainingCents:Math.max(0,remaining),
    ok:problems.length===0 && remaining===0};
}
// 'KSM-A-000012' (Phase 3) and 'A-000012' (Phase 2) both count towards this device's counter.
function receiptSeq(no, devPrefix){
  var m = /^(?:[A-Z0-9]+-)?([A-Z0-9]+)-(\d+)$/.exec(String(no||''));
  return (m && m[1]===devPrefix) ? parseInt(m[2],10) : 0;
}
// Human receipt number. The real unique ID stays the UUID; this is only for people. Must run inside a transaction on 'meta' and 'sales'.
async function takeReceiptNo(tx){
  var dev = await getS(tx,'meta','device'), st = (await getS(tx,'meta','settings')) || {}, shop = st.receiptShopCode || 'KSM';
  for(var guard=0; guard<1000; guard++){
    dev.receiptCounter = (dev.receiptCounter||0)+1;
    var no = shop+'-'+dev.prefix+'-'+String(dev.receiptCounter).padStart(6,'0');
    var clash = await byIndex(tx,'sales','receiptNo',no);
    if(!clash.length){ await putS(tx,'meta',dev); return {receiptNo:no, dev:dev, settings:st}; }
  }
  throw bizErr('receipt','Could not find a free receipt number.');
}
function countSales(list){ var seen = {}, n = 0; list.forEach(function(s){ if(!seen[s.saleId]){ seen[s.saleId] = 1; n++; } }); return n; }

/* ===== stock ledger ===== */
function stockStatus(p){
  if(!p.trackStock) return 'untracked';
  if((p.stockMilli||0) <= 0) return 'out';
  if(p.minStockMilli>0 && p.stockMilli < p.minStockMilli) return 'low';
  return 'ok';
}
function ledgerCheck(){
  var sums = {}, has = {};
  M.moves.forEach(function(m){ sums[m.productId]=(sums[m.productId]||0)+m.qtyMilli; has[m.productId]=true; });
  var out = [];
  M.products.forEach(function(p){
    var l = sums[p.id]||0, c = p.stockMilli||0;
    if(l!==c || (has[p.id] && !p.trackStock)) out.push({product:p, cached:c, ledger:l});
  });
  return out;
}
async function ledgerSum(tx, pid){
  var rows = await byIndex(tx,'stock_movements','productId',pid);
  return rows.reduce(function(a,m){ return a+m.qtyMilli; },0);
}
async function postMovement(tx, p, mv){
  var cur = await ledgerSum(tx,p.id);
  if(p.trackStock && (p.stockMilli||0)!==cur){
    await auditPut(tx,'stock_cache_mismatch_healed',{productId:p.id, name:p.name, cached:p.stockMilli||0, ledger:cur});
  }
  var after = cur + mv.qtyMilli;
  var rec = {id:uuid(), productId:p.id, qtyMilli:mv.qtyMilli, reason:mv.reason, subReason:mv.subReason||null, refType:mv.refType||null,
    refId:mv.refId||null, note:mv.note||'', ts:Date.now(), deviceId:M.device.deviceId, balanceAfterMilli:after};
  await addS(tx,'stock_movements',rec);
  p.stockMilli = after; p.trackStock = true; p.updatedAt = Date.now();
  await putS(tx,'products',p);
  return rec;
}

/* ===== services (every change goes through one of these, in one transaction) ===== */
async function svcCreateCategory(name){
  name = (name||'').trim();
  var id = uuid(), now = Date.now();
  await withTx(['categories','audit_logs'],'readwrite',async function(tx){
    var all = await getAllS(tx,'categories');
    if(all.some(function(c){ return c.active && c.name.toLowerCase()===name.toLowerCase(); })) throw bizErr('duplicate', name+' is already in your list.');
    await addS(tx,'categories',{id:id, name:name, active:true, createdAt:now, updatedAt:now, legacyId:null});
    await auditPut(tx,'category_created',{id:id, name:name});
  });
  return id;
}
async function svcSetCategoryActive(id, active){
  await withTx(['categories','products','audit_logs'],'readwrite',async function(tx){
    var c = await getS(tx,'categories',id); if(!c) throw bizErr('missing','Category not found.');
    c.active = active; c.updatedAt = Date.now(); await putS(tx,'categories',c);
    if(!active){
      var ps = await byIndex(tx,'products','categoryId',id);
      for(var i=0;i<ps.length;i++){ if(ps[i].active){ ps[i].active=false; ps[i].updatedAt=Date.now(); await putS(tx,'products',ps[i]); } }
    }
    await auditPut(tx, active?'category_reactivated':'category_deactivated',{id:id, name:c.name});
  });
}
async function svcCreateProduct(o){
  var id = uuid(), now = Date.now(), name = (o.name||'').trim();
  if(!name) throw bizErr('invalid','Type a product name first.');
  await withTx(['categories','products','stock_movements','meta','audit_logs'],'readwrite',async function(tx){
    var catId = o.categoryId, cat;
    if(!catId){
      var cn = (o.newCategory||'').trim(); if(!cn) throw bizErr('invalid','Choose a category or type a new one.');
      var cats = await getAllS(tx,'categories');
      cat = cats.filter(function(c){ return c.active && c.name.toLowerCase()===cn.toLowerCase(); })[0];
      if(!cat){ cat = {id:uuid(), name:cn, active:true, createdAt:now, updatedAt:now, legacyId:null}; await addS(tx,'categories',cat); await auditPut(tx,'category_created',{id:cat.id,name:cn}); }
      catId = cat.id;
    } else { cat = await getS(tx,'categories',catId); }
    var prods = await getAllS(tx,'products');
    if(prods.some(function(p){ return p.active && p.categoryId===catId && p.name.toLowerCase()===name.toLowerCase(); }))
      throw bizErr('duplicate', name+' is already under '+(cat?cat.name:'that category')+'.');
    var bc = (o.barcode||'').trim();
    if(bc && prods.some(function(p){ return p.active && p.barcode===bc; })) throw bizErr('duplicate','Barcode '+bc+' is already used by another product.');
    var p = {id:id, categoryId:catId, name:name, barcode:bc, unit:o.unit||'pcs', costCents:(o.costCents==null?null:o.costCents), priceCents:o.priceCents||0,
      stockMilli:0, minStockMilli:o.minStockMilli||0, trackStock:false, supplier:(o.supplier||'').trim(), description:(o.description||'').trim(),
      active:true, createdAt:now, updatedAt:now, legacyId:null};
    await addS(tx,'products',p);
    if(o.openingMilli!=null) await postMovement(tx,p,{qtyMilli:o.openingMilli, reason:'opening', note:'Opening stock'});
    await auditPut(tx,'product_created',{id:id, name:name, openingMilli:o.openingMilli==null?null:o.openingMilli});
  });
  return id;
}
async function svcUpdateProduct(id, ch){

    }

    }

    if(ch.costCents!==undefined && ch.costCents!==p.costCents) logs.push(['cost_changed',{old:p.costCents, new:ch.costCents}]);
    var other = Object.keys(ch).filter(function(k){ return k!=='priceCents' && k!=='costCents' && ch[k]!==p[k]; });
    Object.keys(ch).forEach(function(k){ p[k]=ch[k]; });

async function svcAdjustStock(pid, o){
  var res = 'ok';
  await withTx(['products','stock_movements','meta','audit_logs'],'readwrite',async function(tx){
    var p = await getS(tx,'products',pid); if(!p) throw bizErr('missing','Product not found.');
    var cur = await ledgerSum(tx,pid), delta, reason = 'adjustment';
    var q = o.qtyMilli;
    if(!(q>=0)) throw bizErr('invalid','Enter a quantity (0 or more).');
    if(o.mode==='opening'){
      if(p.trackStock) throw bizErr('invalid','Opening stock is already set for '+p.name+'. Use Adjust instead.');
      delta = q; reason = 'opening';
    } else if(o.mode==='add'){ if(!(q>0)) throw bizErr('invalid','Enter a quantity above 0.'); delta = q; }
    else if(o.mode==='remove'){ if(!(q>0)) throw bizErr('invalid','Enter a quantity above 0.'); delta = -q; }
    else if(o.mode==='set'){ delta = q - cur; reason = 'count_correction'; }
    else throw bizErr('invalid','Unknown adjustment.');
    if(cur+delta<0 && !state.allowNegative) throw bizErr('negative','Stock cannot go below zero. '+fmtQty(cur/1000)+' '+p.unit+' on hand.');
    if(delta===0 && reason!=='opening'){ res = 'nochange'; return; }
    await postMovement(tx,p,{qtyMilli:delta, reason:reason, subReason:o.subReason||null, note:o.note||''});
    await auditPut(tx,'stock_adjusted',{productId:pid, name:p.name, mode:o.mode, delta:delta, from:cur, to:cur+delta, subReason:o.subReason||null, note:o.note||''});
  });
  return res;
}
async function svcRecordSale(o){

    }

      deviceId:dev.deviceId, createdBy:'owner', createdAt:now, updatedAt:now});

      costKnown:p.costCents!=null, lineCents:line});
    if(p.trackStock) await postMovement(tx,p,{qtyMilli:-o.qtyMilli, reason:'sale', refType:'sale', refId:saleId});
    if(o.priceCents>0 && o.priceCents!==p.priceCents){

// ONE transaction: header, items, payments, stock movements, cached stock, receipt counter and audit all commit together, or none do.
async function svcCompleteSale(o){
  var out = {}, inLines = o.lines || [];
  await withTx(['products','categories','sales','sale_items','payments','stock_movements','meta','audit_logs'],'readwrite',async function(tx){
    var i, l, p, prods = {}, need = {};
    // 1. Validate the cart
    if(!inLines.length) throw bizErr('empty','The cart is empty. Add a product first.');
    for(i=0;i<inLines.length;i++){
      l = inLines[i];
      if(!(Number.isInteger(l.qtyMilli) && l.qtyMilli>0)) throw bizErr('invalid','Enter a quantity above 0 for '+(l.name||'every item')+'.');
      if(!(Number.isInteger(l.unitPriceCents) && l.unitPriceCents>=0)) throw bizErr('invalid','The price of '+(l.name||'an item')+' is not valid.');
      if(!(Number.isInteger(l.lineDiscountCents||0) && (l.lineDiscountCents||0)>=0)) throw bizErr('discount','The discount on '+(l.name||'an item')+' is not valid.');
      if(!prods[l.productId]){
        p = await getS(tx,'products',l.productId);
        if(!p || !p.active) throw bizErr('missing',(l.name||'A product')+' is no longer active. Remove it from the cart.');
        prods[l.productId] = p; need[l.productId] = 0;
      }
      need[l.productId] += l.qtyMilli;
    }
    // 2. Totals and discounts (recomputed here; the screen's numbers are never trusted)
    var tot = computeTotals(inLines, o.saleDiscountCents||0);
    for(i=0;i<tot.rows.length;i++) if(tot.rows[i].lineDisc>tot.rows[i].gross) throw bizErr('discount','The discount on '+prods[inLines[i].productId].name+' is more than the item amount.');
    if(!Number.isInteger(tot.saleDiscCents) || tot.saleDiscCents<0 || tot.saleDiscCents>tot.afterLineCents) throw bizErr('discount','The sale discount is more than the amount of the sale.');
    // 3. Stock: EVERY tracked product is checked before anything is written
    if(!state.allowNegative){
      var short = [], pids = Object.keys(need);
      for(i=0;i<pids.length;i++){
        p = prods[pids[i]];
        if(!p.trackStock) continue;
        var cur = await ledgerSum(tx,p.id);
        if(cur-need[p.id]<0) short.push(p.name+': '+fmtQty(need[p.id]/1000)+' '+p.unit+' wanted, '+fmtQty(Math.max(0,cur)/1000)+' in stock');
      }
      if(short.length) throw bizErr('insufficient','Not enough stock. '+short.join('; ')+'.',{short:short});
    }
    // 4. Payments
    var rows = (o.payments||[]).map(function(r,k){
      if(!PAY_LABEL[r.method]) throw bizErr('payment','Unknown payment method.');
      if(!(Number.isInteger(r.amountCents) && r.amountCents>0)) throw bizErr('payment','Every payment needs an amount above 0.');
      var ref = (r.reference||'').trim();
      if(r.method==='credit' && !ref) throw bizErr('payment','Add who owes the credit amount (name or phone).');
      return {k:k, method:r.method, amountCents:r.amountCents, reference:r.method==='mpesa' ? ref.toUpperCase() : ref};
    });
    var pr = calcPayments(tot.totalCents, rows);
    if(!pr.ok){
      if(pr.remainingCents>0) throw bizErr('payment','The payments are '+fmtMoney(pr.remainingCents/100)+' short. Add a payment, or record the rest as credit.');
      throw bizErr('payment','The payments do not match the amount due.');
    }
    // 5. Write everything
    var rn = await takeReceiptNo(tx), dev = rn.dev, st = rn.settings, saleId = uuid(), now = Date.now();
    var methods = []; rows.forEach(function(r){ if(methods.indexOf(r.method)<0) methods.push(r.method); });
    await addS(tx,'sales',{id:saleId, receiptNo:rn.receiptNo, date:o.date, ts:now, seq:now, status:'completed', model:2, source:'pos',
      grossCents:tot.grossCents, lineDiscountCents:tot.lineDiscCents, saleDiscountCents:tot.saleDiscCents, discountCents:tot.discountCents, totalCents:tot.totalCents,
      paidCents:pr.paidCents, creditCents:pr.creditCents, changeCents:pr.changeCents,
      paymentStatus:pr.creditCents===0 ? 'paid' : (pr.creditCents===tot.totalCents ? 'credit' : 'part_credit'), methods:methods,
      shopName:st.shopName||'', shopLine:st.shopLine||'', footer:st.receiptFooter||'', deviceCode:dev.prefix,
      deviceId:dev.deviceId, createdBy:'owner', createdAt:now, updatedAt:now});
    for(i=0;i<inLines.length;i++){
      l = inLines[i]; p = prods[l.productId];
      var cat = await getS(tx,'categories',p.categoryId), r = tot.rows[i];
      await addS(tx,'sale_items',{id:uuid(), saleId:saleId, lineNo:i+1, productId:p.id, categoryId:p.categoryId, nameSnap:p.name, categoryNameSnap:cat?cat.name:'',
        unitSnap:p.unit, qtyMilli:l.qtyMilli, unitPriceCents:l.unitPriceCents, unitCostCents:(l.unitCostCents==null?null:l.unitCostCents),
        costKnown:l.unitCostCents!=null, grossCents:r.gross, lineDiscountCents:r.lineDisc, saleDiscountShareCents:r.saleShare, lineCents:r.net});
      if(p.trackStock) await postMovement(tx,p,{qtyMilli:-l.qtyMilli, reason:'sale', refType:'sale', refId:saleId});
    }
    for(i=0;i<pr.recs.length;i++){
      var x = pr.recs[i];
      await addS(tx,'payments',{id:uuid(), saleId:saleId, receiptNo:rn.receiptNo, seq:i, method:x.row.method, amountCents:x.appliedCents,
        tenderedCents:x.tenderedCents, changeCents:x.changeCents, reference:x.row.reference, referenceType:x.row.reference ? 'manual_entry' : null,
        createdAt:now, deviceId:dev.deviceId, createdBy:'owner'});
    }
    await auditPut(tx,'sale_completed',{saleId:saleId, receiptNo:rn.receiptNo, model:2, items:inLines.length, totalCents:tot.totalCents,
      discountCents:tot.discountCents, methods:methods, creditCents:pr.creditCents});
    out.saleId = saleId; out.receiptNo = rn.receiptNo;
  });
  return out;
}

async function svcVoidSale(saleId, reason, note){
  await withTx(['sales','sale_items','products','stock_movements','meta','audit_logs'],'readwrite',async function(tx){
    var s = await getS(tx,'sales',saleId); if(!s) throw bizErr('missing','Entry not found.');
    if(s.status!=='completed') throw bizErr('invalid','This entry is already voided.');
    s.status = 'void'; s.voidReason = reason||''; s.voidNote = note||''; s.voidedAt = Date.now(); s.voidedBy = 'owner'; s.voidedDevice = M.device ? M.device.deviceId : null; s.updatedAt = Date.now();
    await putS(tx,'sales',s);
    var its = await byIndex(tx,'sale_items','saleId',saleId);
    for(var i=0;i<its.length;i++){
      var p = await getS(tx,'products',its[i].productId); if(!p) continue;
      var mv = (await byIndex(tx,'stock_movements','productId',p.id)).filter(function(m){ return m.refId===saleId; });
      var hasSale = mv.some(function(m){ return m.reason==='sale'; });
      var net = mv.reduce(function(a,m){ return a+m.qtyMilli; },0);
      if(hasSale && net<0) await postMovement(tx,p,{qtyMilli:-net, reason:'void', refType:'sale', refId:saleId, note:reason||''});
    }
    await auditPut(tx,'sale_voided',{saleId:saleId, receiptNo:s.receiptNo, reason:reason||'', note:note||'', totalCents:s.totalCents});
  });
}
async function svcUnvoidSale(saleId){

    var s = await getS(tx,'sales',saleId); if(!s) throw bizErr('missing','Entry not found.');

      var p = await getS(tx,'products',its[i].productId); if(!p) continue;
      var mv = (await byIndex(tx,'stock_movements','productId',p.id)).filter(function(m){ return m.refId===saleId; });

  });

/* ===== legacy data: detect, validate, transform, migrate, verify, revert ===== */
// The legacy key is only ever READ. No code in this file or anywhere else writes to or removes it.
function readLegacyRaw(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }

function validateLegacy(o){
  var errs = [];
  if(!o || typeof o!=='object' || !Array.isArray(o.categories) || !Array.isArray(o.sales))
    return {ok:false, errors:['This is not Sales record data (it needs a list of categories and a list of sales).'], summary:null};
  var dateRe = /^\d{4}-\d{2}-\d{2}$/;
  o.categories.forEach(function(c,i){
    if(!c || typeof c.name!=='string' || !c.name.trim() || !Array.isArray(c.items)){ errs.push('Category #'+(i+1)+' is not valid.'); return; }
    c.items.forEach(function(it,j){
      if(!it || typeof it.name!=='string' || !it.name.trim()) errs.push('Item #'+(j+1)+' in "'+c.name+'" has no name.');
      else if(!(isFinite(Number(it.price)) && Number(it.price)>=0)) errs.push('Item "'+it.name+'" has an invalid price.');
    });
  });
  o.sales.forEach(function(s,i){
    if(!s || typeof s!=='object'){ errs.push('Sale #'+(i+1)+' is not a record.'); return; }
    var id = s.id!==undefined ? String(s.id) : '#'+(i+1), bad = [];
    if(!(typeof s.qty==='number' && isFinite(s.qty) && s.qty>0)) bad.push('quantity');
    if(!(typeof s.price==='number' && isFinite(s.price) && s.price>=0)) bad.push('price');
    if(!(typeof s.date==='string' && dateRe.test(s.date))) bad.push('date');
    if(!(typeof s.ts==='number' && isFinite(s.ts))) bad.push('time');
    ['name','unit','catName'].forEach(function(f){ if(typeof s[f]!=='string' || !s[f].trim()) bad.push(f); });
    if(bad.length) errs.push('Sale '+id+': invalid '+bad.join(', ')+'.');
  });
  if(errs.length) return {ok:false, errors:errs, summary:null};
  var items = 0, total = 0, from = null, to = null;
  o.categories.forEach(function(c){ items += c.items.length; });
  o.sales.forEach(function(s){ total += s.qty*s.price; if(!from || s.date<from) from = s.date; if(!to || s.date>to) to = s.date; });
  return {ok:true, errors:[], summary:{categories:o.categories.length, items:items, sales:o.sales.length, total:total, from:from, to:to}};
}

function transformLegacy(o, base, deviceId){
  var seq = 0, cats = [], prods = [], sales = [], items = [], catByLegacy = {}, prodByLegacy = {};
  var report = {precision:[], orphanCategories:[], orphanProducts:[]};
  function mkCat(name, legacyId, active, orphan){
    var c = {id:uuid(), name:name, active:active, createdAt:base+(seq++), updatedAt:base, legacyId:legacyId==null?null:String(legacyId), orphan:!!orphan};
    cats.push(c); return c;
  }
  function mkProd(li, cat, active, orphan){
    var p = {id:uuid(), categoryId:cat.id, name:li.name, barcode:'', unit:li.unit||'pcs', costCents:null, priceCents:toCents(li.price||0), stockMilli:0,
      minStockMilli:0, trackStock:false, supplier:'', description:'', active:active, createdAt:base+(seq++), updatedAt:base,
      legacyId:li.id==null?null:String(li.id), orphan:!!orphan};
    prods.push(p); return p;
  }
  o.categories.forEach(function(lc){
    var c = mkCat(lc.name, lc.id, true, false); catByLegacy[lc.id] = c;
    lc.items.forEach(function(li){ prodByLegacy[li.id] = mkProd(li, c, true, false); });
  });
  var order = o.sales.map(function(s,i){ return {s:s, i:i}; }).sort(function(a,b){ return (a.s.ts-b.s.ts) || (a.i-b.i); });
  var rn = {}; order.forEach(function(x,k){ rn[x.i] = 'L-'+String(k+1).padStart(6,'0'); });
  o.sales.forEach(function(s,i){
    var ckey = s.catId!=null ? s.catId : 'name:'+s.catName, cat = catByLegacy[ckey];
    if(!cat){ cat = mkCat(s.catName, s.catId, false, true); catByLegacy[ckey] = cat; report.orphanCategories.push(s.catName); }
    var pkey = s.itemId!=null ? s.itemId : 'name:'+s.catName+'|'+s.name, prod = prodByLegacy[pkey];
    if(!prod){ prod = mkProd({id:s.itemId, name:s.name, unit:s.unit, price:s.price}, cat, false, true); prodByLegacy[pkey] = prod; report.orphanProducts.push(s.name); }
    var qm = toMilli(s.qty), pc = toCents(s.price), line = lineCentsOf(qm,pc), saleId = uuid();
    sales.push({id:saleId, receiptNo:rn[i], date:s.date, ts:s.ts, seq:i, status:'completed', totalCents:line, source:'legacy', deviceId:deviceId,
      createdBy:'legacy', legacyId:s.id==null?null:String(s.id), createdAt:s.ts, updatedAt:s.ts});
    items.push({id:uuid(), saleId:saleId, productId:prod.id, categoryId:cat.id, nameSnap:s.name, categoryNameSnap:s.catName, unitSnap:s.unit,
      qtyMilli:qm, unitPriceCents:pc, unitCostCents:null, costKnown:false, lineCents:line,
      legacy:{id:s.id, qty:s.qty, price:s.price, itemId:s.itemId, catId:s.catId}});
    if(Math.abs(s.qty*1000-qm)>1e-6 || Math.abs(s.price*100-pc)>1e-6)
      report.precision.push({index:i, legacyId:s.id, name:s.name, date:s.date, qty:s.qty, price:s.price, qtyMilli:qm, priceCents:pc, lineCents:line});
  });
  var settings = {key:'settings', currency:o.currency||'', pie:Object.assign({},PIE_DEFAULT,o.pie||{}), exportPeriod:o.exportPeriod||'day', allowNegativeStock:false};
  return {categories:cats, products:prods, sales:sales, items:items, settings:settings, report:report};
}

async function readAllRows(){
  return withTx(ALL_STORES,'readonly',function(tx){ return Promise.all(ALL_STORES.map(function(n){ return getAllS(tx,n); })); });
}

async function verifyMigration(legacy, raw, source, tr){
  var r = await readAllRows();
  var cats = r[1], prods = r[2], sales = r[3], items = r[4], moves = r[5];
  var checks = [];
  function chk(name, ok, detail){ checks.push({name:name, ok:!!ok, detail:detail||''}); }
  var nLeg = legacy.sales.length, nItemsLeg = 0;
  legacy.categories.forEach(function(c){ nItemsLeg += c.items.length; });
  chk('Number of sales', sales.length===nLeg, sales.length+' stored, '+nLeg+' in the old data');
  chk('Sale lines', items.length===nLeg, items.length+' stored, '+nLeg+' expected');
  chk('Categories', cats.filter(function(c){ return !c.orphan; }).length===legacy.categories.length, cats.filter(function(c){ return !c.orphan; }).length+' stored, '+legacy.categories.length+' in the old data');
  chk('Products', prods.filter(function(p){ return !p.orphan; }).length===nItemsLeg, prods.filter(function(p){ return !p.orphan; }).length+' stored, '+nItemsLeg+' in the old data');
  var itemsBySale = {}; items.forEach(function(it){ (itemsBySale[it.saleId] = itemsBySale[it.saleId] || []).push(it); });
  var bySeq = {}; sales.forEach(function(s){ bySeq[s.seq] = s; });
  var flagged = {}; tr.report.precision.forEach(function(x){ flagged[x.index] = true; });
  var bad = [], sumNew = 0, sumExact = 0, sumTol = 0, aggL = {}, aggN = {}, aggTol = {}, aggQTol = {};
  legacy.sales.forEach(function(ls,i){
    var s = bySeq[i], it = s && itemsBySale[s.id] && itemsBySale[s.id][0], pr = [];
    if(!s || !it){ bad.push('Sale #'+(i+1)+' is missing'); return; }
    var fl = !!flagged[i];
    if(s.date!==ls.date) pr.push('date');
    if(s.ts!==ls.ts) pr.push('time');
    if(it.nameSnap!==ls.name) pr.push('item name');
    if(it.categoryNameSnap!==ls.catName) pr.push('category');
    if(it.unitSnap!==ls.unit) pr.push('unit');
    if(s.status!=='completed') pr.push('status');
    var qd = Math.abs(it.qtyMilli/1000-ls.qty), pd = Math.abs(it.unitPriceCents/100-ls.price);
    if(fl ? (qd>0.0005+1e-9 || pd>0.005+1e-9) : (qd>1e-6 || pd>1e-6)) pr.push('quantity or price');
    var exact = ls.qty*ls.price*100, tol = fl ? (0.5+ls.qty*0.5+0.05*ls.price+1e-6) : (0.5+1e-6);
    if(Math.abs(it.lineCents-exact)>tol) pr.push('amount');
    if(s.totalCents!==it.lineCents) pr.push('sale total');
    if(pr.length) bad.push((ls.name||'?')+' on '+ls.date+' (sale #'+(i+1)+'): '+pr.join(', '));
    sumNew += it.lineCents; sumExact += exact; sumTol += tol;
    var k = ls.date+'|'+ls.catName+'|'+ls.name+'|'+ls.unit;
    aggL[k] = aggL[k] || {q:0,c:0}; aggN[k] = aggN[k] || {q:0,c:0};
    aggL[k].q += ls.qty; aggL[k].c += exact; aggN[k].q += it.qtyMilli/1000; aggN[k].c += it.lineCents;
    aggTol[k] = (aggTol[k]||0)+tol; aggQTol[k] = (aggQTol[k]||0)+(fl?0.0005:1e-6);
  });
  chk('Every sale matches: date, time, item, category, unit, quantity, price, amount', bad.length===0, bad.slice(0,5).join('; '));
  chk('Total sales value', Math.abs(sumNew-sumExact)<=sumTol+1e-6, 'old data '+exactMoney(sumExact/100)+', new data '+exactMoney(sumNew/100)+' (each line is rounded to the cent)');
  var aggBad = Object.keys(aggL).filter(function(k){ return !aggN[k] || Math.abs(aggL[k].q-aggN[k].q)>aggQTol[k]+1e-9 || Math.abs(aggL[k].c-aggN[k].c)>aggTol[k]+1e-6; });
  chk('Day-by-day, item-by-item quantities and values', aggBad.length===0, aggBad.slice(0,3).join('; '));
  var ids = [], okIds = true;
  [cats,prods,sales,items].forEach(function(a){ a.forEach(function(x){ ids.push(x.id); if(!UUID_RE.test(x.id)) okIds = false; }); });
  chk('Unique identifiers (UUID) on every record', okIds && new Set(ids).size===ids.length, ids.length+' records');
  chk('No stock movements created for old sales', moves.length===0, 'stock of old items starts as "not tracked"');
  chk('Old sales marked "cost unknown" (excluded from profit later)', items.every(function(i){ return i.costKnown===false && i.unitCostCents===null; }), '');
  if(source==='browser') chk('Original data in this browser is unchanged', readLegacyRaw()===raw, 'the old data is still stored exactly as before');
  return {ok:checks.every(function(c){ return c.ok; }), checks:checks, totals:{old:sumExact/100, new:sumNew/100},
    precision:tr.report.precision, orphanCategories:tr.report.orphanCategories, orphanProducts:tr.report.orphanProducts,
    counts:{sales:sales.length, products:prods.length, categories:cats.length}};
}

async function runMigration(raw, source){
  var sha = await sha256Hex(raw), legacy;
  try{ legacy = JSON.parse(raw); }catch(e){ throw bizErr('invalid','The old data cannot be read (it is not valid JSON).'); }
  var v = validateLegacy(legacy);
  if(!v.ok) throw bizErr('invalid','The old data has problems and was not migrated: '+v.errors.slice(0,3).join(' '));
  var tr = transformLegacy(legacy, Date.now(), M.device.deviceId);
  // ONE transaction: all or nothing.
  await withTx(ALL_STORES,'readwrite',async function(tx){
    var counts = await Promise.all(DATA_STORES.map(function(n){ return req(tx.objectStore(n).count()); }));
    if(counts.some(function(c){ return c>0; })) throw bizErr('not_empty','The database already contains records, so the migration was refused.');
    var mig = await getS(tx,'meta','migration');
    if(mig && (mig.status==='complete' || mig.status==='not_needed')) throw bizErr('already','The migration was already completed.');
    for(var i=0;i<tr.categories.length;i++) await addS(tx,'categories',tr.categories[i]);
    for(i=0;i<tr.products.length;i++) await addS(tx,'products',tr.products[i]);
    for(i=0;i<tr.sales.length;i++) await addS(tx,'sales',tr.sales[i]);
    for(i=0;i<tr.items.length;i++) await addS(tx,'sale_items',tr.items[i]);
    await putS(tx,'meta',tr.settings);
    await putS(tx,'meta',{key:'legacyBackup', raw:raw, sha256:sha, at:Date.now(), source:source});
    await putS(tx,'meta',{key:'migration', status:'pending_verification', source:source, startedAt:Date.now(), legacySha256:sha});
    await auditPut(tx,'migration_written',{sales:tr.sales.length, products:tr.products.length, categories:tr.categories.length, source:source});
  });
  var report = await verifyMigration(legacy, raw, source, tr);
  if(report.ok){
    await withTx(['meta','audit_logs'],'readwrite',async function(tx){
      await putS(tx,'meta',{key:'migration', status:'complete', source:source, at:Date.now(), legacySha256:sha, report:report});
      await auditPut(tx,'migration_completed',{sales:report.counts.sales, products:report.counts.products});
    });
  } else {
    await withTx(ALL_STORES,'readwrite',async function(tx){
      for(var i=0;i<DATA_STORES.length;i++) await clearS(tx,DATA_STORES[i]);
      await putS(tx,'meta',{key:'migration', status:'failed', source:source, at:Date.now(), legacySha256:sha, report:report});
      await auditPut(tx,'migration_rolled_back',{reason:'verification failed'});
    });
  }
  return report;
}

async function revertMigration(){
  await takeSnapshot('before_revert');
  await withTx(ALL_STORES,'readwrite',async function(tx){
    var cur = await getS(tx,'meta','migration');
    for(var i=0;i<DATA_STORES.length;i++) await clearS(tx,DATA_STORES[i]);
    tx.objectStore('meta').delete('settings'); tx.objectStore('meta').delete('lastExport');
    await putS(tx,'meta',{key:'migration', status:'reverted', at:Date.now(), previous:(cur&&cur.status)||null, legacySha256:cur?cur.legacySha256:null});
    await auditPut(tx,'migration_reverted',{});
  });
}

/* ===== backup, restore, snapshots ===== */
var BACKUP_TABLES = ['meta','categories','products','sales','sale_items','stock_movements','audit_logs','payments'];
var REQUIRED_TABLES = BACKUP_TABLES.slice(0,7); // 'payments' is optional so Phase 2 backups still restore
async function collectBackupData(){
  var r = await withTx(BACKUP_TABLES,'readonly',function(tx){ return Promise.all(BACKUP_TABLES.map(function(n){ return getAllS(tx,n); })); });
  return {meta:r[0].filter(function(m){ return m.key!=='device'; }), categories:r[1], products:r[2], sales:r[3], sale_items:r[4], stock_movements:r[5], audit_logs:r[6], payments:r[7]};
}
function dataCounts(d){ return {categories:d.categories.length, products:d.products.length, sales:d.sales.length, sale_items:d.sale_items.length, stock_movements:d.stock_movements.length, audit_logs:d.audit_logs.length, payments:(d.payments||[]).length}; }
function stampNow(){ var d = new Date(); return ymd(d)+'-'+pad(d.getHours())+pad(d.getMinutes()); }
async function buildBackupFile(){
  var data = await collectBackupData(), json = JSON.stringify(data), sha = await sha256Hex(json);
  var text = JSON.stringify({format:'sales-pos-backup', formatVersion:1, schemaVersion:SCHEMA_VERSION, appVersion:APP_VERSION, createdAt:new Date().toISOString(),
    deviceId:M.device.deviceId, counts:dataCounts(data), sha256:sha, data:data}, null, 1);
  return {name:'sales-pos-backup-'+stampNow()+'.json', text:text, counts:dataCounts(data)};
}
function buildLegacyBackupFile(raw, sha, summary, source){
  return {name:'sales-record-legacy-backup-'+stampNow()+'.json', text:JSON.stringify({format:'sales-record-legacy-backup', formatVersion:1,
    createdAt:new Date().toISOString(), source:source, storageKey:KEY, sha256:sha, counts:{categories:summary.categories, items:summary.items, sales:summary.sales}, raw:raw}, null, 1)};
}
function consistencyProblems(d){
  if(!d.payments) d.payments = [];
  var p = [], ids = {};
  BACKUP_TABLES.slice(1).forEach(function(n){ ids[n] = {}; d[n].forEach(function(x){ if(!x || !x.id){ p.push(n+' has a record without an id'); return; } if(ids[n][x.id]) p.push(n+' has a duplicate id'); ids[n][x.id] = x; }); });
  d.sale_items.forEach(function(i){ if(!ids.sales[i.saleId]) p.push('a sale line points to a missing sale'); if(!ids.products[i.productId]) p.push('a sale line points to a missing product'); });
  var hasItem = {}, lineSum = {}, paySum = {};
  d.sale_items.forEach(function(i){ hasItem[i.saleId] = true; lineSum[i.saleId] = (lineSum[i.saleId]||0) + i.lineCents; });
  d.sales.forEach(function(s){ if(!hasItem[s.id]) p.push('a sale has no lines'); });
  d.payments.forEach(function(x){ if(!ids.sales[x.saleId]) p.push('a payment points to a missing sale'); paySum[x.saleId] = (paySum[x.saleId]||0) + x.amountCents; });
  d.sales.forEach(function(s){
    if(s.model!==2) return;
    if(lineSum[s.id]!==s.totalCents) p.push('a sale total does not match its lines');
    if((paySum[s.id]||0)!==s.totalCents) p.push('the payments of a sale do not add up to its total');
  });
  d.products.forEach(function(x){ if(!ids.categories[x.categoryId]) p.push('a product points to a missing category'); });
  d.stock_movements.forEach(function(m){ if(!ids.products[m.productId]) p.push('a stock movement points to a missing product'); });
  return p.filter(function(x,i){ return p.indexOf(x)===i; });
}
async function validateBackup(b){
  var p = [];
  if(!b || b.format!=='sales-pos-backup') return ['This is not a Sales record backup file.'];
  if(b.formatVersion!==1) p.push('Unsupported backup format version '+b.formatVersion+'.');
  if(!(b.schemaVersion<=SCHEMA_VERSION)) p.push('This backup was made by a newer version of the app.');
  var d = b.data;
  if(!d || REQUIRED_TABLES.some(function(n){ return !Array.isArray(d[n]); }) || (d.payments!==undefined && !Array.isArray(d.payments))) { p.push('The backup is missing some data tables.'); return p; }
  var sha = await sha256Hex(JSON.stringify(d));
  if(sha!==b.sha256) p.push('The checksum does not match: the file was changed or damaged.');
  return p.concat(consistencyProblems(d));
}
async function classifyImport(text){
  var o; try{ o = JSON.parse(text); }catch(e){ throw bizErr('invalid','That is not a readable backup file.'); }
  if(o && o.format==='sales-pos-backup') return {type:'full', obj:o};
  if(o && o.format==='sales-record-legacy-backup'){
    if(typeof o.raw!=='string') throw bizErr('invalid','This legacy backup file has no data in it.');
    var sha = await sha256Hex(o.raw);
    if(o.sha256 && sha!==o.sha256) throw bizErr('checksum','This backup file is damaged (its checksum does not match). Try another copy.');
    return {type:'legacy', raw:o.raw};
  }
  if(o && Array.isArray(o.categories) && Array.isArray(o.sales)) return {type:'legacy', raw:text};
  throw bizErr('invalid','This file is not a Sales record backup.');
}
async function takeSnapshot(reason){
  var data = await collectBackupData(), counts = dataCounts(data);
  await withTx(['snapshots'],'readwrite',async function(tx){
    await putS(tx,'snapshots',{id:uuid(), ts:Date.now(), reason:reason, counts:counts, data:data});
    var all = await getAllS(tx,'snapshots'); all.sort(function(a,b){ return b.ts-a.ts; });
    for(var i=5;i<all.length;i++) tx.objectStore('snapshots').delete(all[i].id);
  });
}
async function getSnapshotData(id){
  return withTx(['snapshots'],'readonly',async function(tx){ var s = await getS(tx,'snapshots',id); return s ? s.data : null; });
}
async function restoreFromData(d, how){
  var probs = consistencyProblems(d);
  if(probs.length) throw bizErr('invalid','The backup data is inconsistent: '+probs[0]+'.');
  await takeSnapshot('before_'+how);
  await withTx(ALL_STORES.filter(function(n){ return n!=='snapshots'; }),'readwrite',async function(tx){
    var i, k;
    for(i=0;i<DATA_STORES.length;i++) await clearS(tx,DATA_STORES[i]);
    await clearS(tx,'audit_logs');
    var meta = await getAllS(tx,'meta');
    for(i=0;i<meta.length;i++) if(meta[i].key!=='device') tx.objectStore('meta').delete(meta[i].key);
    for(i=0;i<d.meta.length;i++) if(d.meta[i].key!=='device') await putS(tx,'meta',d.meta[i]);
    ['categories','products','sales','sale_items','stock_movements','audit_logs','payments'].forEach(function(n){ (d[n]||[]).forEach(function(r){ addS(tx,n,r); }); });
    var mig = d.meta.filter(function(m){ return m.key==='migration'; })[0];
    if(!mig || (mig.status!=='complete' && mig.status!=='not_needed')) await putS(tx,'meta',{key:'migration', status:'not_needed', via:'restore', at:Date.now()});
    if(!d.meta.some(function(m){ return m.key==='settings'; })) await putS(tx,'meta',{key:'settings', currency:'', pie:Object.assign({},PIE_DEFAULT), exportPeriod:'day', allowNegativeStock:false});
    var dev = await getS(tx,'meta','device'), max = 0;
    d.sales.forEach(function(s){ k = receiptSeq(s.receiptNo, dev.prefix); if(k>max) max = k; });
    if(max>(dev.receiptCounter||0)){ dev.receiptCounter = max; await putS(tx,'meta',dev); }
    await auditPut(tx,'restore_completed',{how:how, counts:dataCounts(d)});
  });
}

function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function fmtQty(n){ return parseFloat(Number(n).toFixed(2)).toLocaleString(); }
function fmtMoney(n){ return (state.currency ? state.currency+' ' : '') + Number(n).toLocaleString(undefined,{maximumFractionDigits:2}); }
function $(id){ return document.getElementById(id); }

function h(tag, props){
  var el = document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v = props[k];
      if(v==null || v===false) return;
      if(k==='class') el.className = v;
      else if(k.indexOf('on')===0) el.addEventListener(k.slice(2), v);
      else if(k==='value') el.value = v;
      else if(k==='type' || k.indexOf('-')>-1 || k==='inputmode') el.setAttribute(k, v);
      else if(k in el){ try{ el[k]=v; }catch(e){ el.setAttribute(k,v); } }
      else el.setAttribute(k, v);
    });
  }
  for(var i=2;i<arguments.length;i++) append(el, arguments[i]);
  return el;
}
function append(el, c){
  if(c==null || c===false) return;
  if(Array.isArray(c)){ c.forEach(function(x){ append(el,x); }); return; }
  el.append(c.nodeType ? c : document.createTextNode(String(c)));
}

/* ---------- data helpers ---------- */
function groupDay(list){
  var cats = {}, order = [];
  list.forEach(function(s){
    if(!cats[s.catName]){ cats[s.catName] = {name:s.catName, map:{}, rows:[]}; order.push(s.catName); }
    var c = cats[s.catName], k = s.name+'|'+s.unit;
    if(!c.map[k]){ c.map[k] = {name:s.name, unit:s.unit, qty:0, value:0}; c.rows.push(c.map[k]); }

  });

}

/* ---------- pie chart ---------- */
var SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs){
  var el = document.createElementNS(SVGNS, tag);
  Object.keys(attrs||{}).forEach(function(k){ el.setAttribute(k, attrs[k]); });
  for(var i=2;i<arguments.length;i++) append(el, arguments[i]);
  return el;
}
function fmtShort(d){ return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }

function periodSales(pOverride){
  var p = pOverride || state.pie.period;
  if(p==='all') return {list:state.sales.slice(), label:'All time'};
  var end = parseDay(day), n = p==='day' ? 1 : (p==='7' ? 7 : 30);
  var start = new Date(end); start.setDate(start.getDate()-(n-1));
  var a = ymd(start);
  var list = state.sales.filter(function(s){ return s.date>=a && s.date<=day; });
  var label = n===1 ? (day===ymd(new Date()) ? 'Today' : fmtShort(end)) : 'Last '+n+' days, to '+fmtShort(end);
  return {list:list, label:label};
}

function computeSlices(){
  var cfg = state.pie, ps = periodSales(), map = {}, arr = [], units = {};
  ps.list.forEach(function(s){
    var key = cfg.group==='cat' ? s.catName : s.catName+'|'+s.name;
    var name = cfg.group==='cat' ? s.catName : s.name;
    var v = cfg.metric==='amount' ? lv(s) : s.qty;
    units[s.unit] = true;
    if(!map[key]){ map[key] = {key:key, name:name, value:0}; arr.push(map[key]); }
    map[key].value += v;
  });
  arr = arr.filter(function(x){ return x.value>0; }).sort(function(a,b){ return b.value-a.value; });
  if(arr.length>9){
    var rest = arr.slice(8);
    arr = arr.slice(0,8).concat([{key:'__other',name:'Other ('+rest.length+')',value:rest.reduce(function(a,x){ return a+x.value; },0),other:true}]);
  }
  var total = 0;
  arr.forEach(function(x,i){ x.color = x.other ? PIE_COLORS[8] : PIE_COLORS[i%8]; total += x.value; });
  if(pieSel && !arr.some(function(x){ return x.key===pieSel; })) pieSel = null;
  return {slices:arr, total:total, label:ps.label, mixedUnits:Object.keys(units).length>1};
}

function pieVal(v){ return state.pie.metric==='amount' ? fmtMoney(v) : fmtQty(v); }
function pieOf(frac){ var p = frac*100; return p<1 ? '<1%' : Math.round(p)+'%'; }
function pickSlice(key){ pieSel = (pieSel===key) ? null : key; refreshPie(); }

function pieSvg(slices, total){
  var cx=130, cy=130, r=112, a=-Math.PI/2;
  var svg = sv('svg',{viewBox:'0 0 260 260','class':'pie',role:'img','aria-label':'Pie chart showing each share of sales'});
  slices.forEach(function(s){
    var frac = s.value/total, a2 = a + frac*2*Math.PI, mid = (a+a2)/2;
    var sel = pieSel===s.key, off = sel ? 9 : 0;
    var g = sv('g',{transform:'translate('+(Math.cos(mid)*off).toFixed(2)+' '+(Math.sin(mid)*off).toFixed(2)+')',
      opacity:(pieSel && !sel) ? '0.5' : '1',style:'cursor:pointer'});
    var shape;
    if(frac>=0.9999){
      shape = sv('circle',{cx:cx,cy:cy,r:r,fill:s.color});
    } else {
      var x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      shape = sv('path',{d:'M'+cx+' '+cy+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+(frac>0.5?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z',fill:s.color});
    }
    shape.setAttribute('style','stroke:var(--surface);stroke-width:2');
    shape.append(sv('title',{}, s.name+': '+pieVal(s.value)+' ('+pieOf(frac)+')'));
    g.append(shape);
    if(frac>=0.06){
      var lx = cx + r*0.62*Math.cos(mid), ly = cy + r*0.62*Math.sin(mid);
      g.append(sv('text',{x:lx.toFixed(2),y:ly.toFixed(2),'text-anchor':'middle','dominant-baseline':'central',fill:'#fff',
        'font-size':'16','font-weight':'700','pointer-events':'none',
        style:'paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:3px'}, Math.round(frac*100)+'%'));
    }
    g.addEventListener('click', function(){ pickSlice(s.key); });
    svg.append(g);
    a = a2;
  });
  return svg;
}

function segRow(label, key, opts){
  var cfg = state.pie;
  return h('div',{class:'seg-row'},
    h('span',{class:'seg-label'},label),
    h('div',{class:'seg',role:'group','aria-label':label},
      opts.map(function(o){
        var on = cfg[key]===o[0];
        return h('button',{type:'button',class:on?'on':'','aria-pressed':on?'true':'false',
          onclick:function(){ cfg[key]=o[0]; pieSel=null; saveSettings(); refreshPie(); }}, o[1]);
      })));
}

function piePanel(){
  var data = computeSlices(), cfg = state.pie;
  var p = h('section',{class:'panel piepanel',id:'piepanel'},
    h('h2',null,'Sales share'),
    h('div',{class:'muted',style:'margin:-6px 0 12px;font-size:.9rem'},data.label),
    segRow('Measure','metric',[['amount','Amount'],['qty','Quantity']]),
    segRow('Group by','group',[['item','Items'],['cat','Categories']]),
    segRow('Period','period',[['day','Day'],['7','7 days'],['30','30 days'],['all','All time']])
  );
  if(!data.slices.length){
    p.append(h('p',{class:'note'}, cfg.metric==='amount'
      ? 'No priced sales in this period yet. Add a price with each sale, or switch Measure to Quantity.'
      : 'No sales in this period yet. Add a sale and the chart will appear.'));
    return p;
  }
  var chosen = data.slices.filter(function(s){ return s.key===pieSel; })[0] || null;
  var top = chosen || data.slices[0];
  p.append(h('div',{class:'readout'},
    (chosen ? '' : 'Top seller: ')+top.name+' \u2022 '+pieVal(top.value)+' \u2022 '+pieOf(top.value/data.total)));
  p.append(pieSvg(data.slices, data.total));
  var ul = h('ul',{class:'legend'});
  data.slices.forEach(function(s){
    ul.append(h('li',{class:(pieSel && pieSel!==s.key)?'dim':''},
      h('button',{type:'button','aria-pressed':pieSel===s.key?'true':'false',onclick:function(){ pickSlice(s.key); }},
        h('span',{class:'sw',style:'background:'+s.color}),
        h('span',{class:'ln'},s.name),
        h('span',{class:'lv'},pieVal(s.value)),
        h('span',{class:'lp'},pieOf(s.value/data.total)))));
  });
  p.append(ul);
  if(cfg.metric==='qty' && data.mixedUnits) p.append(h('p',{class:'note'},'Quantities mix different units (kg, pcs and so on), so the shares are only a rough guide. Use Amount for an exact comparison.'));
  return p;
}
